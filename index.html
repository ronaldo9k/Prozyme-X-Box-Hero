<!DOCTYPE html>

<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070b"
  >

  <link rel="manifest" href="./manifest.json">

  <!-- 🐐 Ronaldo 앱 아이콘 -->

  <link
    rel="icon"
    type="image/png"
    href="./Ronaldo.png"
  >

  <link
    rel="apple-touch-icon"
    href="./Ronaldo.png"
  >

  <title>
    푸로찜에스 X 박스히어로
  </title>

  <style>

    /* ======================================================
       🎨 기본 색상
       ====================================================== */

    :root {

      --bg:
        #05070b;

      --card:
        rgba(10,15,25,.42);

      --text:
        #111827;

      --muted:
        #6b7280;

      --line:
        #e5e7eb;

      --green:
        #15803d;

      --red:
        #dc2626;

      --dark:
        #111827;

      --gold:
        #c9a227;

    }


    /* ======================================================
       🔧 기본
       ====================================================== */

    * {

      box-sizing:
        border-box;

    }


    html {

      scroll-behavior:
        smooth;

    }


    body {

      margin:
        0;

      /*
       * ======================================================
       * 🐐 Fenomeno.png 전체 배경화면
       * ======================================================
       */

      background-color:
        #05070b;

      background-image:
        url('/Prozyme-X-Box-Hero/Fenomeno.png');

      background-size:
        cover;

      background-position:
        center;

      background-repeat:
        no-repeat;

      background-attachment:
        fixed;

      padding:
        0 14px 30px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

      color:
        var(--text);

      min-height:
        100vh;

      position:
        relative;

      overflow-x:
        hidden;

    }


    /* ======================================================
       ⭐ STEP 2
       ====================================================== */

    body.step2-mode {

      background-color:
        #05070b;

      background-image:
        url('/Prozyme-X-Box-Hero/Fenomeno.png');

      background-size:
        cover;

      background-position:
        center;

      background-repeat:
        no-repeat;

      background-attachment:
        fixed;

      padding:
        16px 14px 30px;

    }


    body.step2-mode::before,
    body.step2-mode::after {

      background:
        transparent;

    }


    body::before {

      content:
        "";

      position:
        fixed;

      inset:
        0;

      background:
        linear-gradient(
          rgba(0,0,0,.04),
          rgba(0,0,0,.10)
        );

      pointer-events:
        none;

      z-index:
        0;

    }


    body::after {

      content:
        "";

      position:
        fixed;

      inset:
        0;

      background:
        transparent;

      pointer-events:
        none;

      z-index:
        0;

    }


    .container {

      max-width:
        560px;

      margin:
        0 auto;

      position:
        relative;

      z-index:
        1;

    }


    .screen {

      width:
        100%;

    }


    .step-hidden {

      display:
        none !important;

    }


    /* ======================================================
       🏆 HERO
       ====================================================== */

    .hero {

      height:
        285px;

      border-radius:
        0 0 30px 30px;

      overflow:
        hidden;

      position:
        relative;

      display:
        flex;

      align-items:
        flex-end;

      justify-content:
        center;

      margin:
        0 -14px 18px;

      background:
        transparent;

      box-shadow:
        none;

    }


    .hero::before {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      background:
        transparent;

      pointer-events:
        none;

    }


    .hero::after {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      background:
        transparent;

      pointer-events:
        none;

    }


    .hero-content {

      position:
        relative;

      z-index:
        2;

      width:
        100%;

      text-align:
        center;

      padding:
        0 28px 45px;

    }


    /* ======================================================
       ⭐ 왕관
       ====================================================== */

    .hero-symbol {

      font-size:
        24px;

      color:
        #e0b52c;

      margin:
        0 0 5px 61px;

      text-shadow:
        0 2px 9px
        rgba(0,0,0,.83);

      text-align:
        left;

    }


    /* ======================================================
       ⭐ 메인 제목
       ====================================================== */

    .hero-title {

      font-size:
        28px;

      line-height:
        1.15;

      font-weight:
        950;

      letter-spacing:
        -1.2px;

      color:
        white;

      text-shadow:
        0 3px 15px
        rgba(0,0,0,.70);

      text-align:
        center;

    }


    /* ======================================================
       ⭐ 가족 이름
       ====================================================== */

    .hero-sub {

      margin-top:
        11px;

      font-size:
        14px;

      font-weight:
        800;

      color:
        #ffffff;

      letter-spacing:
        .3px;

      text-shadow:
        0 2px 10px
        rgba(0,0,0,.80);

      text-align:
        center;

    }


    /* ======================================================
       ⭐ STEP 2에서는 첫 화면 HERO를 완전히 숨김
       ====================================================== */

    body.step2-mode .hero {

      display:
        none;

    }


    /* ======================================================
       🔢 STEP INDICATOR
       ====================================================== */

    .step-indicator {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        8px;

      margin:
        0 0 15px;

    }


    .step-dot {

      width:
        9px;

      height:
        9px;

      border-radius:
        50%;

      background:
        rgba(255,255,255,.45);

    }


    .step-dot.active {

      width:
        11px;

      height:
        11px;

      background:
        var(--gold);

      box-shadow:
        0 0 0 4px
        rgba(201,162,39,.13);

    }


    .step-line {

      width:
        38px;

      height:
        1px;

      background:
        rgba(255,255,255,.45);

    }


    body.step2-mode .step-dot {

      background:
        #d1d5db;

    }


    body.step2-mode .step-dot.active {

      background:
        var(--gold);

    }


    body.step2-mode .step-line {

      background:
        #d1d5db;

    }


    /* ======================================================
       🃏 CARD
       ====================================================== */

    .card {

      background:
        rgba(10,15,25,.48);

      border:
        1px solid
        rgba(255,255,255,.18);

      border-radius:
        22px;

      padding:
        21px;

      margin-bottom:
        16px;

      box-shadow:
        0 18px 50px
        rgba(0,0,0,.30);

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);

    }


    /* ======================================================
       ⭐ STEP 2 전체 흰색 플로팅 패널
       ====================================================== */

    #step2 {

      background:
        #ffffff;

      border:
        1px solid
        rgba(255,255,255,.90);

      border-radius:
        26px;

      padding:
        14px 16px 24px;

      margin:
        0 auto;

      box-shadow:
        0 18px 55px
        rgba(0,0,0,.30);

      min-height:
        calc(100vh - 46px);

    }


    body.step2-mode #step2 {

      background:
        #ffffff;

    }


    body.step2-mode #step2 > .card {

      background:
        #ffffff;

      border:
        none;

      box-shadow:
        none;

      border-radius:
        0;

      padding:
        0;

      margin-bottom:
        0;

      backdrop-filter:
        none;

      -webkit-backdrop-filter:
        none;

    }


    .card-title {

      font-size:
        19px;

      font-weight:
        900;

      margin-bottom:
        17px;

      letter-spacing:
        -.5px;

      color:
        white;

      text-shadow:
        0 2px 8px
        rgba(0,0,0,.45);

    }


    body.step2-mode .card-title {

      color:
        #111827;

      text-shadow:
        none;

    }


    .card-subtitle {

      color:
        rgba(255,255,255,.72);

      font-size:
        13px;

      margin:
        -8px 0 17px;

      line-height:
        1.5;

    }


    /* ======================================================
       📥📤 입출고 선택
       ====================================================== */

    .mode-buttons {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        10px;

      margin-bottom:
        17px;

    }


    .mode-button {

      border:
        1px solid
        transparent;

      border-radius:
        16px;

      padding:
        15px 10px;

      font-size:
        16px;

      font-weight:
        900;

      cursor:
        pointer;

      transition:
        .18s;

    }


    .mode-button.in {

      background:
        #ecfdf3;

      color:
        var(--green);

    }


    .mode-button.out {

      background:
        #fff1f2;

      color:
        var(--red);

    }


    .mode-button.active {

      box-shadow:
        0 0 0 3px
        currentColor;

    }


    /* ======================================================
       🎙️ 음성 영역
       ====================================================== */

    .voice-area {

      text-align:
        center;

      padding:
        8px 4px 5px;

    }


    .main-buttons {

      display:
        flex;

      justify-content:
        center;

      gap:
        10px;

    }


    .main-button {

      width:
        170px;

      height:
        56px;

      border:
        1px solid
        rgba(201,162,39,.75);

      border-radius:
        17px;

      color:
        white;

      background:
        linear-gradient(
          135deg,
          #111827,
          #252c3a
        );

      font-size:
        15px;

      font-weight:
        900;

      cursor:
        pointer;

      box-shadow:
        0 9px 25px
        rgba(0,0,0,.20);

      transition:
        .18s;

    }


    .main-button:hover {

      transform:
        translateY(-1px);

    }


    .main-button:disabled {

      opacity:
        .48;

      cursor:
        not-allowed;

      transform:
        none;

    }


    .main-button.finish {

      background:
        linear-gradient(
          135deg,
          #c9a227,
          #a88414
        );

      color:
        #111827;

    }


    .main-button-label {

      display:
        inline-block;

      margin-left:
        4px;

    }


    .voice-status {

      margin-top:
        13px;

      font-size:
        13px;

      color:
        var(--muted);

      min-height:
        20px;

    }


    .timer {

      margin-top:
        4px;

      font-size:
        12px;

      color:
        var(--muted);

      min-height:
        17px;

    }


    /* ======================================================
       🎙️ 음성 인식 결과
       ====================================================== */

    .recognized-text {

      margin-top:
        13px;

      height:
        56px;

      min-height:
        56px;

      padding:
        0 15px;

      background:
        #f8fafc;

      border:
        1px solid
        #e5e7eb;

      border-radius:
        17px;

      font-size:
        14px;

      line-height:
        1.45;

      text-align:
        left;

      display:
        flex;

      align-items:
        center;

      white-space:
        pre-wrap;

      word-break:
        break-word;

      overflow:
        hidden;

    }


    /* ======================================================
       ✏️ 직접 입력 버튼
       ====================================================== */

    .direct-button {

      width:
        100%;

      margin-top:
        12px;

      border:
        1px solid
        #d9dde5;

      border-radius:
        15px;

      padding:
        14px;

      background:
        white;

      color:
        #374151;

      font-size:
        15px;

      font-weight:
        800;

      cursor:
        pointer;

    }


    /* ======================================================
       📝 STEP 2 HEADER
       ====================================================== */

    .preview-header {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        7px;

      margin-bottom:
        18px;

    }


    .preview-actions {

      display:
        grid;

      grid-template-columns:
        1fr 1fr 1fr;

      align-items:
        center;

      gap:
        7px;

      width:
        100%;

    }


    .preview-action-button {

      width:
        100%;

      min-width:
        0;

      border:
        1px solid
        #e1e4e9;

      border-radius:
        11px;

      padding:
        10px 7px;

      background:
        white;

      color:
        #374151;

      font-size:
        12px;

      font-weight:
        800;

      white-space:
        nowrap;

      cursor:
        pointer;

      box-shadow:
        0 2px 7px
        rgba(0,0,0,.04);

    }


    .preview-action-button:hover {

      border-color:
        var(--gold);

      background:
        #fffdf4;

    }


    .preview-step-label {

      display:
        none;

    }


    /* ======================================================
       🏢 STEP 2 거래처 영역
       ⭐ 이제 거래처 목록은 여기서 펼쳐지지 않습니다.
       ⭐ 선택된 거래처만 표시됩니다.
       ====================================================== */

    .client-search-wrap {

      position:
        relative;

    }


    .client-search-buttons {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        7px;

      margin-bottom:
        8px;

    }


    .client-search-button {

      border:
        1px solid
        #dfe3e8;

      border-radius:
        12px;

      padding:
        13px 10px;

      background:
        white;

      color:
        #374151;

      font-size:
        14px;

      font-weight:
        800;

      cursor:
        pointer;

    }


    .client-search-button.active {

      border-color:
        var(--gold);

      background:
        #fffdf4;

      box-shadow:
        0 0 0 3px
        rgba(201,162,39,.10);

    }


    /*
     * ======================================================
     * ⭐ 기존 STEP 2 안의 검색창/후보 목록은 숨김
     *
     * 거래처 검색/선택은 새로운 거래처 선택 화면에서
     * 처리합니다.
     * ======================================================
     */

    #step2 .client-search-row,

    #step2 .client-candidates {

      display:
        none;

    }


    /*
     * ======================================================
     *  [ 거래처 검색 ] 버튼을 눌렀을 때만
     *    STEP 2 안에서 검색창과 후보 목록이 보입니다.
     *
     * 전체 화면 거래처 선택은
     * [ 거래처 선택 ] 버튼만 사용합니다.
     * ======================================================
     */

    #step2 .client-search-wrap.search-open .client-search-row {

      display:
        block;

    }


    #step2 .client-search-wrap.search-open .client-candidates:not(:empty) {

      display:
        flex;

      flex-direction:
        column;

      gap:
        7px;

      margin-top:
        9px;

      max-height:
        46vh;

      overflow-y:
        auto;

      -webkit-overflow-scrolling:
        touch;

    }


    #step2 .client-search-row input {

      width:
        100%;

      padding:
        12px 13px;

      border:
        1px solid
        #dfe3e8;

      border-radius:
        13px;

      background:
        #ffffff;

      color:
        #111827;

      font-size:
        16px;

      outline:
        none;

    }


    #step2 .client-candidates .client-candidate {

      padding:
        12px 14px;

      border:
        1px solid
        #e5e7eb;

      border-radius:
        13px;

      background:
        #ffffff;

      color:
        #111827;

      font-size:
        14px;

      font-weight:
        700;

      cursor:
        pointer;

    }


    #step2 .client-candidates .client-candidate:active {

      border-color:
        var(--gold);

      background:
        #fffdf4;

    }



    .selected-client {

      margin-top:
        8px;

      padding:
        12px 13px;

      background:
        #ecfdf3;

      border:
        1px solid
        #bbf7d0;

      color:
        #166534;

      border-radius:
        12px;

      font-size:
        13px;

      font-weight:
        800;

    }


    /* ======================================================
       👥 새로운 거래처 선택 화면
       ====================================================== */

    #partnerPicker {

      background:
        #ffffff;

      border:
        1px solid
        rgba(255,255,255,.90);

      border-radius:
        26px;

      padding:
        14px 16px 24px;

      margin:
        0 auto;

      box-shadow:
        0 18px 55px
        rgba(0,0,0,.30);

      min-height:
        calc(100vh - 46px);

    }


    .partner-picker-header {

      display:
        flex;

      align-items:
        center;

      gap:
        10px;

      margin-bottom:
        16px;

    }


    .partner-picker-back {

      width:
        42px;

      height:
        42px;

      flex:
        0 0 42px;

      border:
        1px solid
        #e1e4e9;

      border-radius:
        12px;

      background:
        white;

      color:
        #374151;

      font-size:
        20px;

      font-weight:
        900;

      cursor:
        pointer;

      box-shadow:
        0 2px 7px
        rgba(0,0,0,.04);

    }


    .partner-picker-title-wrap {

      flex:
        1;

      min-width:
        0;

    }


    .partner-picker-title {

      font-size:
        20px;

      font-weight:
        950;

      color:
        #111827;

      line-height:
        1.25;

    }


    .partner-picker-subtitle {

      margin-top:
        3px;

      font-size:
        12px;

      color:
        #6b7280;

    }


    .partner-picker-search-wrap {

      position:
        relative;

      margin-bottom:
        12px;

    }


    .partner-picker-search-icon {

      position:
        absolute;

      left:
        14px;

      top:
        50%;

      transform:
        translateY(-50%);

      font-size:
        16px;

      z-index:
        1;

    }


    #partnerPickerSearch {

      width:
        100%;

      padding:
        14px 14px 14px 41px;

      border:
        1px solid
        #dfe3e8;

      border-radius:
        14px;

      font-size:
        16px;

      background:
        #ffffff;

      color:
        #111827;

      outline:
        none;

    }


    #partnerPickerSearch:focus {

      border-color:
        var(--gold);

      box-shadow:
        0 0 0 3px
        rgba(201,162,39,.12);

    }


    .partner-picker-count {

      margin:
        0 2px 9px;

      color:
        #6b7280;

      font-size:
        12px;

      font-weight:
        700;

    }


    /*
     * ======================================================
     * ⭐ 새로운 거래처 전체 목록
     *
     * 화면 전체에 가나다순으로 쭉 표시
     * ======================================================
     */

    #partnerPickerCandidates {

      display:
        flex;

      flex-direction:
        column;

      gap:
        7px;

    }


    .partner-picker-candidate {

      width:
        100%;

      min-height:
        49px;

      display:
        flex;

      align-items:
        center;

      padding:
        12px 14px;

      border:
        1px solid
        #e5e7eb;

      border-radius:
        13px;

      background:
        #ffffff;

      color:
        #111827;

      font-size:
        14px;

      font-weight:
        700;

      text-align:
        left;

      cursor:
        pointer;

      transition:
        .15s;

    }


    .partner-picker-candidate:hover {

      border-color:
        var(--gold);

      background:
        #fffdf4;

    }


    .partner-picker-candidate:active {

      transform:
        scale(.99);

    }


    .partner-picker-candidate.selected {

      border-color:
        #86efac;

      background:
        #ecfdf3;

      color:
        #166534;

    }


    .partner-picker-empty {

      padding:
        30px 15px;

      text-align:
        center;

      color:
        #6b7280;

      font-size:
        14px;

      border:
        1px solid
        #e5e7eb;

      border-radius:
        14px;

      background:
        #f8fafc;

    }


    /* ======================================================
       🏷️ FIELD
       ====================================================== */

    .field {

      margin-bottom:
        16px;

    }


    .field:last-child {

      margin-bottom:
        0;

    }


    .field-label {

      display:
        block;

      font-size:
        13px;

      font-weight:
        900;

      margin-bottom:
        7px;

      color:
        #4b5563;

    }


    select,
    input,
    textarea {

      width:
        100%;

      border:
        1px solid
        #dfe3e8;

      border-radius:
        14px;

      padding:
        13px;

      font-size:
        17px;

      background:
        white;

      color:
        #111827;

      outline:
        none;

    }


    select:focus,
    input:focus,
    textarea:focus {

      border-color:
        var(--gold);

      box-shadow:
        0 0 0 3px
        rgba(201,162,39,.12);

    }


    input[type="date"] {

      min-height:
        49px;

    }


    textarea {

      min-height:
        85px;

// ==========================================================
// 🌐 GitHub Pages → GAS Web App
// ==========================================================

const GAS_WEB_APP_URL =
  'https://script.google.com/macros/s/AKfycbzZX1JoVHJ07jFBKY6qH0UNcXHIulQuha6t7JnYfUymh8UKkwfpV0miwsAY_ud4WKvc/exec';


// ==========================================================
// 📦 BoxHero 열기
// ==========================================================

function openBoxHero() {

  /*
   * ======================================================
   * 📦 BoxHero 모바일 앱 우선 실행
   *
   * Android:
   *   BoxHero 공식 Google Play 패키지
   *   com.bgpworks.boxhero
   *
   * iPhone/iPad:
   *   BoxHero 앱 호출용 URL을 먼저 시도하고
   *   앱이 열리지 않으면 웹으로 이동합니다.
   *
   * PC:
   *   기존처럼 BoxHero 웹을 엽니다.
   * ======================================================
   */

  const webUrl =
    'https://app.boxhero.io/';

  const userAgent =
    String(
      navigator.userAgent ||
      ''
    ).toLowerCase();

  const isAndroid =
    userAgent.includes(
      'android'
    );

  const isIOS =
    /iphone|ipad|ipod/.test(
      userAgent
    );

  if (
    isAndroid
  ) {

    const intentUrl =
      'intent://#Intent;' +
      'scheme=boxhero;' +
      'package=com.bgpworks.boxhero;' +
      'end';

    let androidAppOpened =
      false;

    const markAndroidOpened =
      function() {

        androidAppOpened =
          true;

      };

    document.addEventListener(
      'visibilitychange',
      markAndroidOpened,
      {
        once:
          true
      }
    );

    setTimeout(
      function() {

        if (
          !androidAppOpened &&
          document.visibilityState ===
            'visible'
        ) {

          window.open(
            webUrl,
            '_blank'
          );

        }

      },
      1500
    );

    window.location.href =
      intentUrl;

    return;

  }

  if (
    isIOS
  ) {

    let appOpened =
      false;

    const markOpened =
      function() {

        appOpened =
          true;

      };

    document.addEventListener(
      'visibilitychange',
      markOpened,
      {
        once:
          true
      }
    );

    window.location.href =
      'boxhero://';

    setTimeout(
      function() {

        if (
          !appOpened &&
          document.visibilityState ===
            'visible'
        ) {

          window.open(
            webUrl,
            '_blank'
          );

        }

      },
      1500
    );

    return;

  }

  window.open(
    webUrl,
    '_blank'
  );

}


// ==========================================================
// 📡 GAS Web App 호출
// ==========================================================

async function callGas(
  action,
  data
) {

  if (
    !GAS_WEB_APP_URL ||
    GAS_WEB_APP_URL.includes(
      '여기에_실제_GAS'
    )
  ) {

    throw new Error(
      'GAS_WEB_APP_URL이 아직 설정되지 않았습니다.'
    );

  }


  const response =
    await fetch(
      GAS_WEB_APP_URL,
      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify({

            action:
              action,

            data:
              data || {}

          })

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      'GAS Web App HTTP 오류: ' +
      response.status
    );

  }


  const result =
    await response.json();


  if (
    result &&
    result.ok === false
  ) {

    throw new Error(
      result.message ||
      'GAS Web App에서 오류가 발생했습니다.'
    );

  }


  return (
    result &&
    Object.prototype.hasOwnProperty.call(
      result,
      'data'
    )
      ? result.data
      : result
  );

}

function getTodayLocal() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      '0'
    );

  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      '0'
    );

  return (
    year +
    '-' +
    month +
    '-' +
    day
  );

}

function getCurrentTimeLocal() {

  const now =
    new Date();

  const hours =
    String(
      now.getHours()
    ).padStart(
      2,
      '0'
    );

  const minutes =
    String(
      now.getMinutes()
    ).padStart(
      2,
      '0'
    );

  const seconds =
    String(
      now.getSeconds()
    ).padStart(
      2,
      '0'
    );

  return (
    hours +
    ':' +
    minutes +
    ':' +
    seconds
  );

}


// ==========================================================
// 📅 날짜 + 시간 만들기
// ==========================================================

function combineDateAndTime(
  date
) {

  const selectedDate =
    String(
      date ||
      getTodayLocal()
    ).trim();


  const time =
    transactionTime ||
    getCurrentTimeLocal();


  return (
    selectedDate +
    ' ' +
    time
  );

}

function loadMasterData() {

  showLoading(
    'BoxHero 거래처와 상품 정보를 불러오는 중입니다...'
  );


  callGas(
    'getBoxHeroMasterData',
    {}
  )
    .then(
      function(data) {

        masterData =
          data || {

            partners: [],
            items: [],
            locations: []

          };


        populatePartnerSelects();

        populateItemSelects();

        hideLoading();

      }
    )
    .catch(
      function(error) {

        hideLoading();

        alert(
          'BoxHero 정보를 불러오지 못했습니다.\n\n' +
          getErrorMessage(error)
        );

      }
    );

}

// 🔄 STEP 2 새로고침
// ==========================================================

function refreshMasterData() {

    document
      .getElementById(
        'partnerSelect'
      )
      .value;

  const oldItem =
    document
      .getElementById(
        'itemSelect'
      )
      .value;

  const oldQuantity =
    document
      .getElementById(
        'quantityInput'
      )
      .value;

  const oldType =
    document
      .getElementById(
        'typeSelect'
      )
      .value;

  const oldDate =
    document
      .getElementById(
        'dateInput'
      )
      .value;

  const oldMemo =
    document
      .getElementById(
        'memoInput'
      )
      .value;

  const oldDeliveryType =
    document
      .getElementById(
        'deliveryTypeSelect'
      )
      .value;


  showLoading(
    'BoxHero 최신 정보를 다시 불러오는 중입니다...'
  );


  callGas(
    'getBoxHeroMasterData',
    {}
  )
    .then(
      function(data) {

        masterData =
          data || {

            partners: [],
            items: [],
            locations: []

          };


        populatePartnerSelects();

        populateItemSelects();


        document
          .getElementById(
            'partnerSelect'
          )
          .value =
            oldPartner;


        document
          .getElementById(
            'itemSelect'
          )
          .value =
            oldItem;


        document
          .getElementById(
            'quantityInput'
          )
          .value =
            oldQuantity;


        document
          .getElementById(
            'typeSelect'
          )
          .value =
            oldType;


        document
          .getElementById(
            'dateInput'
          )
          .value =
            oldDate;


        document
          .getElementById(
            'memoInput'
          )
          .value =
            oldMemo;


        document
          .getElementById(
            'deliveryTypeSelect'
          )
          .value =
            oldDeliveryType;


        /*
         * ⭐ 새로고침 후에도 비어 있으면
         * 기본 제품 15Kg / 입고 거래처 현대바이오랜드 적용
         */
        if (
          !document
            .getElementById(
              'itemSelect'
            )
            .value
        ) {

          const defaultItem =
            findDefault15KgItem();

          if (
            defaultItem
          ) {

            document
              .getElementById(
                'itemSelect'
              )
              .value =
                defaultItem.id;

          }

        }


        if (
          oldType === 'in' &&
          !document
            .getElementById(
              'partnerSelect'
            )
            .value
        ) {

          const defaultPartner =
            findDefaultInboundPartner();

          if (
            defaultPartner
          ) {

            document
              .getElementById(
                'partnerSelect'
              )
              .value =
                defaultPartner.id;

          }

        }


        selectedType =
          oldType;


        setType(
          oldType
        );


        updateSelectedClient();

        updatePartnerSearchText();

        updateSummary();

        hideLoading();

      }
    )
    .catch(
      function(error) {

        hideLoading();

        alert(
          '새로고침에 실패했습니다.\n\n' +
          getErrorMessage(error)
        );

      }
    );

}


// ==========================================================
// 👥 거래처 SELECT
// ==========================================================

function populatePartnerSelects() {

  const selects = [

    document.getElementById(
      'partnerSelect'
    ),

    document.getElementById(
      'directPartner'
    )

  ];


  selects.forEach(
    function(select) {

      if (!select) {

        return;

      }


      select.innerHTML =
        '<option value="">거래처를 선택하세요</option>';


      const partners =
        [...masterData.partners]
          .sort(
            function(a, b) {

              return String(
                a.name
              ).localeCompare(
                String(
                  b.name
                ),
                'ko'
              );

            }
          );


      partners.forEach(
        function(partner) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            partner.id;


          option.textContent =
            partner.name;


          select.appendChild(
            option
          );

        }
      );


      /*
       * ⭐ 마스터 데이터가 늦게 도착한 경우에도
       * 입고 기본 거래처를 적용합니다.
       */
      if (
        selectedType === 'in' &&
        !select.value
      ) {

        const defaultPartner =
          findDefaultInboundPartner();

        if (
          defaultPartner
        ) {

          select.value =
            defaultPartner.id;

        }

      }

    }
  );

}


// ==========================================================
// ⭐ 기본 거래처 찾기
// ==========================================================

function findDefaultInboundPartner() {

  const partners =
    Array.isArray(
      masterData.partners
    )
      ? masterData.partners
      : [];

  return (
    partners.find(
      function(partner) {

        return String(
          partner.name ||
          ''
        ).includes(
          '현대바이오랜드'
        );

      }
    ) ||
    null
  );

}


// ==========================================================
// ⭐ 기본 제품 찾기 = 푸로찜 에스 15Kg
// ==========================================================

function findDefault15KgItem() {

  const items =
    Array.isArray(
      masterData.items
    )
      ? masterData.items
      : [];

  return (
    items.find(
      function(item) {

        return (
          getProductSize(
            item.name
          ) === 15 &&
          String(
            item.name ||
            ''
          ).includes(
            '푸로찜'
          )
        );

      }
    ) ||
    null
  );

}


// ==========================================================
// 📦 상품 SELECT
// ==========================================================

function populateItemSelects() {

  const selects = [

    document.getElementById(
      'itemSelect'
    ),

    document.getElementById(
      'directItem'
    )

  ];


  selects.forEach(
    function(select) {

      if (!select) {

        return;

      }


      select.innerHTML =
        '<option value="">제품을 선택하세요</option>';


      const items =
        [...masterData.items]
          .filter(
            function(item) {

              const name =
                String(
                  item.name || ''
                );

              return (
                name.includes(
                  '푸로찜'
                ) &&
                (
                  getProductSize(
                    name
                  ) === 12 ||
                  getProductSize(
                    name
                  ) === 15 ||
                  getProductSize(
                    name
                  ) === 20
                )
              );

            }
          )
          .sort(
            function(a, b) {

              const aSize =
                getProductSize(
                  a.name
                );

              const bSize =
                getProductSize(
                  b.name
                );


              const order = {

                15: 1,

                20: 2,

                12: 3

              };


              const aOrder =
                order[aSize] || 99;

              const bOrder =
                order[bSize] || 99;


              if (
                aOrder !==
                bOrder
              ) {

                return (
                  aOrder -
                  bOrder
                );

              }


              return String(
                a.name
              ).localeCompare(
                String(
                  b.name
                ),
                'ko'
              );

            }
          );


      items.forEach(
        function(item) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            item.id;


          option.textContent =
            item.name;


          select.appendChild(
            option
          );

        }
      );


      /*
       * ⭐ 기본 제품 = 푸로찜 에스 15Kg
       *
       * 기존 선택값이 있으면 그대로 유지하고,
       * 비어 있을 때만 15Kg을 기본 선택합니다.
       */
      if (
        !select.value
      ) {

        const defaultItem =
          findDefault15KgItem();

        if (
          defaultItem
        ) {

          select.value =
            defaultItem.id;

        }

      }

    }
  );

}


// ==========================================================
// 📏 제품 규격
// ==========================================================

function getProductSize(
  productName
) {

  const text =
    normalizeSpeechText(
      productName
    );


  if (
    /12(?:kg|키로|킬로|키로그램|킬로그램)/i.test(
      text
    ) ||
    text.includes(
      '12'
    ) &&
    (
      text.includes('kg') ||
      text.includes('키로') ||
      text.includes('킬로') ||
       text.includes('킬로그램') ||
       text.includes('키로그램')
    )
  ) {

    return 12;

  }


  if (
    /15(?:kg|키로|킬로|키로그램|킬로그램)/i.test(
      text
    ) ||
    text.includes(
      '15'
    ) &&
    (
      text.includes('kg') ||
      text.includes('키로') ||
      text.includes('킬로') ||
       text.includes('킬로그램') ||
       text.includes('키로그램')
    )
  ) {

    return 15;

  }


  if (
    /20(?:kg|키로|킬로|키로그램|킬로그램)/i.test(
      text
    ) ||
    text.includes(
      '20'
    ) &&
    (
      text.includes('kg') ||
      text.includes('키로') ||
      text.includes('킬로') ||
       text.includes('킬로그램') ||
       text.includes('키로그램')
    )
  ) {

    return 20;

  }


  if (
    text.includes('십이') &&
    (
      text.includes('키로') ||
      text.includes('킬로') ||
       text.includes('킬로그램') ||
       text.includes('키로그램') ||
      text.includes('kg')
    )
  ) {

    return 12;

  }


  if (
    text.includes('십오') &&
    (
      text.includes('키로') ||
      text.includes('킬로') ||
       text.includes('킬로그램') ||
       text.includes('키로그램') ||
      text.includes('kg')
    )
  ) {

    return 15;

  }


  if (
    text.includes('이십') &&
    (
      text.includes('키로') ||
      text.includes('킬로') ||
       text.includes('킬로그램') ||
       text.includes('키로그램') ||
      text.includes('kg')
    )
  ) {

    return 20;

  }


  return '';

}


// ==========================================================
// 📥📤 거래 유형
// ==========================================================

function setType(
  type
) {

  selectedType =
    type;


  const inButton =
    document.getElementById(
      'inButton'
    );

  const outButton =
    document.getElementById(
      'outButton'
    );


  if (inButton) {

    inButton
      .classList
      .toggle(
        'active',
        type === 'in'
      );

  }


  if (outButton) {

    outButton
      .classList
      .toggle(
        'active',
        type === 'out'
      );

  }


  const typeSelect =
    document.getElementById(
      'typeSelect'
    );


  if (
    typeSelect
  ) {

    typeSelect.value =
      type;

  }


  /*
   * ⭐ 입고를 선택하면
   *    거래처가 비어 있을 때만
   *    현대바이오랜드를 기본값으로 넣습니다.
   *
   * 기존에 사용자가 선택한 거래처는
   * 절대 덮어쓰지 않습니다.
   */
  if (
    type === 'in'
  ) {

    const partnerSelect =
      document.getElementById(
        'partnerSelect'
      );

    if (
      partnerSelect &&
      !partnerSelect.value
    ) {

      const defaultPartner =
        findDefaultInboundPartner();

      if (
        defaultPartner
      ) {

        partnerSelect.value =
          defaultPartner.id;

      }

    }


    const directPartner =
      document.getElementById(
        'directPartner'
      );

    if (
      directPartner &&
      !directPartner.value
    ) {

      const defaultPartner =
        findDefaultInboundPartner();

      if (
        defaultPartner
      ) {

        directPartner.value =
          defaultPartner.id;

      }

    }

  }

}


// ==========================================================
// 🎙️ 마이크 권한 준비
// ==========================================================

async function prepareMicrophone() {

  if (
    microphoneReady
  ) {

    return true;

  }


  if (
    microphonePermissionDenied
  ) {

    alert(
      '마이크 권한이 차단되어 있습니다.\n\n' +
      '휴대폰 브라우저의 사이트 설정에서\n' +
      '마이크 권한을 허용해주세요.'
    );

    return false;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    return true;

  }


  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:
          true
      });


    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    microphoneReady =
      true;


    return true;

  } catch (error) {

    console.log(
      '마이크 권한 확인:',
      error
    );


    if (
      error &&
      (
        error.name ===
        'NotAllowedError' ||
        error.name ===
        'PermissionDeniedError'
      )
    ) {

      microphonePermissionDenied =
        true;


      alert(
        '마이크 권한이 허용되지 않았습니다.\n\n' +
        '휴대폰 브라우저의 사이트 설정에서\n' +
        '마이크 권한을 허용해주세요.'
      );


      return false;

    }


    return true;

  }

}


// ==========================================================
// 🎙️ 음성 인식 시작
// ==========================================================

async function startVoice() {

  if (
    isRecording ||
    recognitionStartPending
  ) {

    return;

  }


  const microphoneOk =
    await prepareMicrophone();


  if (
    !microphoneOk
  ) {

    return;

  }


  if (
    !recognition
  ) {

    if (
      !initRecognition()
    ) {

      return;

    }

  }


  finishRequested =
    false;


  recognitionStartPending =
    true;


  finalTranscript =
    '';

  interimTranscript =
    '';

  displayedTranscript =
    '';


  transactionTime =
    getCurrentTimeLocal();


  document
    .getElementById(
      'recognizedText'
    )
    .textContent =
      '듣고 있습니다...';


  document
    .getElementById(
      'voiceStatus'
    )
    .textContent =
      '주문 내용을 말씀해주세요.';


  document
    .getElementById(
      'startButton'
    )
    .disabled =
      true;


  document
    .getElementById(
      'finishButton'
    )
    .disabled =
      false;


  try {

    recognition.start();

  } catch (e) {

    console.log(
      'recognition.start:',
      e
    );


    recognitionStartPending =
      false;


    isRecording =
      false;

    recognitionRunning =
      false;


    updateVoiceUI();

    return;

  }


  startRecordingTimer();

}


// ==========================================================
// 🎙️ Recognition 초기화
// ==========================================================

function initRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (
    !SpeechRecognition
  ) {

    alert(
      '이 브라우저에서는 음성인식을 사용할 수 없습니다.\n' +
      'Chrome 또는 Edge에서 사용해주세요.'
    );


    return false;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    'ko-KR';


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function() {

      recognitionStartPending =
        false;

      isRecording =
        true;

      recognitionRunning =
        true;

      updateVoiceUI();

    };


  recognition.onresult =
    function(event) {

      let finalText =
        '';

      let interimText =
        '';


      for (
        let i =
          event.resultIndex;

        i <
        event.results.length;

        i++
      ) {

        const transcript =
          event.results[i][0]
            .transcript
            .trim();


        if (
          event.results[i].isFinal
        ) {

          finalText +=
            transcript +
            ' ';

        } else {

          interimText +=
            transcript +
            ' ';

        }

      }


      if (
        finalText
      ) {

        finalTranscript =
          appendWithoutDuplicate(
            finalTranscript,
            finalText
          );

      }


      interimTranscript =
        interimText.trim();


      showCurrentText();

    };


  recognition.onerror =
    function(event) {

      console.log(
        'Speech recognition error:',
        event.error
      );


      if (
        event.error ===
        'not-allowed'
      ) {

        isRecording =
          false;

        recognitionRunning =
          false;

        recognitionStartPending =
          false;


        stopRecordingTimer();


        microphonePermissionDenied =
          true;


        updateVoiceUI();


        alert(
          '마이크 권한이 허용되지 않았습니다.\n' +
          '브라우저의 마이크 권한을 확인해주세요.'
        );


        return;

      }


      if (
        event.error ===
        'aborted'
      ) {

        recognitionStartPending =
          false;

        return;

      }


      if (
        event.error ===
        'no-speech'
      ) {

        document
          .getElementById(
            'voiceStatus'
          )
          .textContent =
            '잠시 기다리고 있습니다. 계속 말씀해주세요.';

      }

    };


  recognition.onend =
    function() {

      recognitionRunning =
        false;


      recognitionStartPending =
        false;


      if (
        isRecording &&
        !finishRequested
      ) {

        clearTimeout(
          recognitionRestartTimer
        );


        recognitionRestartTimer =
          setTimeout(
            function() {

              if (
                !isRecording ||
                finishRequested
              ) {

                return;

              }


              try {

                recognition.start();

              } catch (e) {

                console.log(
                  '자동 재시작:',
                  e
                );


                clearTimeout(
                  recognitionRestartTimer
                );


                recognitionRestartTimer =
                  setTimeout(
                    function() {

                      if (
                        !isRecording ||
                        finishRequested ||
                        recognitionRunning
                      ) {

                        return;

                      }


                      try {

                        recognition.start();

                      } catch (
                        retryError
                      ) {

                        console.log(
                          '자동 재시작 재시도:',
                          retryError
                        );

                      }

                    },
                    500
                  );

              }

            },
            300
          );


        return;

      }


      isRecording =
        false;


      stopRecordingTimer();

      updateVoiceUI();


      if (
        finishRequested &&
        (
          finalTranscript.trim() ||
          displayedTranscript.trim()
        )
      ) {

        finalizeRecording();

      } else {

        finishRequested =
          false;

      }

    };


  return true;

}


// ==========================================================
// 🎙️ 현재 음성 표시
// ==========================================================

function showCurrentText() {

  const finalText =
    finalTranscript.trim();

  const interimText =
    interimTranscript.trim();


  let text =
    finalText;


  if (
    interimText
  ) {

    if (
      text
    ) {

      text +=
        ' ';

    }


    text +=
      interimText;

  }


  if (
    text
  ) {

    displayedTranscript =
      text;


    document
      .getElementById(
        'recognizedText'
      )
      .textContent =
        text;

  }

}


// ==========================================================
// 🔄 중복 문장 방지
// ==========================================================

function appendWithoutDuplicate(
  base,
  addition
) {

  const cleanBase =
    String(
      base || ''
    ).trim();

  const cleanAddition =
    String(
      addition || ''
    ).trim();


  if (
    !cleanAddition
  ) {

    return cleanBase;

  }


  if (
    !cleanBase
  ) {

    return cleanAddition;

  }


  if (
    cleanBase.includes(
      cleanAddition
    )
  ) {

    return cleanBase;

  }


  return (
    cleanBase +
    ' ' +
    cleanAddition
  );

}

function finishRecording() {

  if (
    !isRecording &&
    !recognitionStartPending &&
    !recognition
  ) {

    return;

  }


  finishRequested =
    true;


  isRecording =
    false;


  recognitionStartPending =
    false;


  stopRecordingTimer();


  clearTimeout(
    recognitionRestartTimer
  );


  if (
    recognition &&
    recognitionRunning
  ) {

    try {

      recognition.stop();

    } catch (e) {

      console.log(
        e
      );

    }


    return;

  }


  if (
    finalTranscript.trim() ||
    displayedTranscript.trim()
  ) {

    finalizeRecording();

  } else {

    finishRequested =
      false;

    updateVoiceUI();

    document
      .getElementById(
        'voiceStatus'
      )
      .textContent =
        '음성이 인식되지 않았습니다. 다시 말씀해주세요.';

  }

}

// ==========================================================
// 🧠 주문 분석
// ==========================================================

function parseOrderText(
  text
) {

  const result = {
    type:
      selectedType,

    partnerId:
      '',

    itemId:
      '',

    quantity:
      1,

    date:
      getTodayLocal(),

    memo:
      '',

    deliveryType:
      ''
  };


  const normalized =
    normalizeSpeechText(
      text
    );


  if (
    /입고|입고해|받아|들어|입고로/i
      .test(
        normalized
      )
  ) {

    result.type =
      'in';

  }


  if (
    /출고|출고해|보내|납품|출하/i
      .test(
        normalized
      )
  ) {

    result.type =
      'out';

  }


  /*
   * ======================================================
   * 🔢 수량 인식 핵심 개선
   *
   * 숫자 + 개/박스가 있을 때만 수량으로 인정합니다.
   *
   * 예:
   *   "푸로찜 15kg 2개"
   *      → 제품 15Kg / 수량 2
   *
   *   "푸로찜 15kg"
   *      → 제품 15Kg / 수량 1
   *
   * 따라서 제품 규격의 "15"를 수량으로 잘못
   * 가져오는 문제를 막습니다.
   * ======================================================
   */

  const quantityMatch =
    normalized.match(
      /(\d+)\s*(개|박스|박쓰|box|boxes)/i
    );


  if (
    quantityMatch
  ) {

    const number =
      Number(
        quantityMatch[1]
      );

    if (
      number > 0
    ) {

      result.quantity =
        number;

    }

  }


  /*
   * ======================================================
   * 📦 제품 인식
   *
   * "푸로찜"뿐 아니라 음성인식에서 자주 나오는
   * "프로찜 / 프로팀 / 푸로팀 / 프로 짐" 등을
   * 제품 음성으로 취급합니다.
   *
   * 제품 규격(12/15/20Kg)이 함께 있으면
   * 해당 규격 제품을 우선 선택합니다.
   * ======================================================
   */

  const itemMatch =
    findBestItemFromSpeech(
      normalized
    );


  if (
    itemMatch
  ) {

    result.itemId =
      itemMatch.id;

  } else {

    /*
     * 제품 규격이 없거나 제품명이 흔들려도
     * 기본 제품은 푸로찜 에스 15Kg입니다.
     */
    const defaultItem =
      findDefault15KgItem();

    if (
      defaultItem
    ) {

      result.itemId =
        defaultItem.id;

    }

  }


  const partnerMatch =
    findBestPartnerFromSpeech(
      normalized
    );


  if (
    partnerMatch
  ) {

    result.partnerId =
      partnerMatch.id;

  } else if (
    result.type === 'in'
  ) {

    /*
     * ⭐ 입고 음성에서 거래처가 인식되지 않으면
     * 현대바이오랜드를 기본값으로 사용합니다.
     */
    const defaultPartner =
      findDefaultInboundPartner();

    if (
      defaultPartner
    ) {

      result.partnerId =
        defaultPartner.id;

    }

  }


  let deliveryType =
    '';


  if (
    /택배/.test(
      normalized
    )
  ) {

    deliveryType =
      '택배 발송';

  } else if (
    /본사/.test(
      normalized
    )
  ) {

    deliveryType =
      '본사 발송';

  } else if (
    /창고|창고수령|창고에서받/.test(
      normalized
    )
  ) {

    deliveryType =
      '창고 수령';

  }


  result.deliveryType =
    deliveryType;


  if (
    deliveryType
  ) {

    result.memo =
      deliveryType;

  } else {

    result.memo =
      '';

  }


  return result;

}

// ==========================================================
// 🧹 음성인식 문자열 정규화
// ==========================================================

function normalizeSpeechText(
  text
) {

  return String(
    text || ''
  )
    .toLowerCase()
    .replace(
      /[\s\-_.,/()[\]{}:;!?~'"`]+/g,
      ''
    )
    .trim();

}


// ==========================================================
// 🔤 문자열 유사도
// ==========================================================

function getStringSimilarity(
  a,
  b
) {

  const first =
    normalizeSpeechText(
      a
    );

  const second =
    normalizeSpeechText(
      b
    );


  if (
    !first ||
    !second
  ) {

    return 0;

  }


  if (
    first ===
    second
  ) {

    return 1;

  }


  if (
    first.includes(
      second
    ) ||
    second.includes(
      first
    )
  ) {

    const shorter =
      Math.min(
        first.length,
        second.length
      );

    const longer =
      Math.max(
        first.length,
        second.length
      );


    return (
      shorter /
      longer
    );

  }


  const distance =
    levenshteinDistance(
      first,
      second
    );


  const maxLength =
    Math.max(
      first.length,
      second.length
    );


  if (
    !maxLength
  ) {

    return 0;

  }


  return (
    1 -
    (
      distance /
      maxLength
    )
  );

}


// ==========================================================
// 🔢 편집거리
// ==========================================================

function levenshteinDistance(
  a,
  b
) {

  const first =
    String(
      a || ''
    );

  const second =
    String(
      b || ''
    );


  const matrix =
    [];


  for (
    let i = 0;

    i <= first.length;

    i++
  ) {

    matrix[i] =
      [i];

  }


  for (
    let j = 0;

    j <= second.length;

    j++
  ) {

    matrix[0][j] =
      j;

  }


  for (
    let i = 1;

    i <= first.length;

    i++
  ) {

    for (
      let j = 1;

      j <= second.length;

      j++
    ) {

      const cost =
        first[i - 1] ===
        second[j - 1]
          ? 0
          : 1;


      matrix[i][j] =
        Math.min(

          matrix[i - 1][j] + 1,

          matrix[i][j - 1] + 1,

          matrix[i - 1][j - 1] +
          cost

        );

    }

  }


  return (
    matrix[first.length][second.length]
  );

}


// ==========================================================
// 👥 BoxHero 거래처 음성 매칭
// ==========================================================

function findBestPartnerFromSpeech(
  speechText
) {

  const speech =
    normalizeSpeechText(
      speechText
    );


  if (
    !speech
  ) {

    return null;

  }


  let bestPartner =
    null;

  let bestScore =
    0;


  masterData.partners.forEach(
    function(partner) {

      const name =
        String(
          partner.name || ''
        )
          .trim();


      if (
        !name
      ) {

        return;

      }


      const normalizedName =
        normalizeSpeechText(
          name
        );


      if (
        !normalizedName
      ) {

        return;

      }


      let score =
        0;


      if (
        speech ===
        normalizedName
      ) {

        score =
          1.0;

      }


      else if (
        speech.includes(
          normalizedName
        )
      ) {

        score =
          0.98;

      }


      else if (
        normalizedName.includes(
          speech
        ) &&
        speech.length >= 2
      ) {

        score =
          0.90;

      }


      else {

        score =
          getStringSimilarity(
            speech,
            normalizedName
          );

      }


      if (
        normalizedName.length <= 2 &&
        score < 1
      ) {

        return;

      }


      if (
        score >
        bestScore
      ) {

        bestScore =
          score;

        bestPartner =
          partner;

      }

    }
  );


  if (
    bestScore < 0.72
  ) {

    return null;

  }


  return bestPartner;

}


// ==========================================================
// 📦 BoxHero 상품 음성 매칭
// ==========================================================

function findBestItemFromSpeech(
  speechText
) {

  const speech =
    normalizeSpeechText(
      speechText
    );


  if (
    !speech
  ) {

    return null;

  }


  const items =
    masterData.items.filter(
      function(item) {

        const name =
          String(
            item.name || ''
          );


        return (
          name.includes(
            '푸로찜'
          ) &&
          (
            getProductSize(
              name
            ) === 12 ||
            getProductSize(
              name
            ) === 15 ||
            getProductSize(
              name
            ) === 20
          )
        );

      }
    );


  let requestedSize =
    getSpokenProductSize(
      speech
    );


  /*
   * ======================================================
   * ⭐ 제품명 음성 별칭
   *
   * 음성인식이
   *   푸로찜 / 프로찜 / 프로팀 / 푸로팀 /
   *   프로 짐 / 푸로 짐
   * 등으로 흔들려도 제품으로 인식합니다.
   * ======================================================
   */

  const productAlias =
    /푸로찜|프로찜|푸로팀|프로팀|푸로짐|프로짐|푸로짐다|프로짐다|푸로/
      .test(
        speech
      );


  /*
   * 제품 음성이 명확하고 규격이 없으면
   * 현재 기본 제품인 15Kg을 사용합니다.
   */
  if (
    productAlias &&
    !requestedSize
  ) {

    requestedSize =
      15;

  }


  let bestItem =
    null;

  let bestScore =
    0;


  items.forEach(
    function(item) {

      const itemName =
        String(
          item.name || ''
        );


      const normalizedItemName =
        normalizeSpeechText(
          itemName
        );


      const itemSize =
        getProductSize(
          itemName
        );


      let score =
        getStringSimilarity(
          speech,
          normalizedItemName
        );


      if (
        requestedSize &&
        itemSize ===
        requestedSize
      ) {

        score +=
          0.35;

      }


      if (
        requestedSize &&
        itemSize &&
        itemSize !==
        requestedSize
      ) {

        score -=
          0.50;

      }


      /*
       * 제품 별칭이 확인되면
       * 해당 규격 제품에 강한 우선순위를 줍니다.
       */
      if (
        productAlias
      ) {

        score +=
          0.45;

      }


      if (
        score >
        bestScore
      ) {

        bestScore =
          score;

        bestItem =
          item;

      }

    }
  );


  if (
    requestedSize
  ) {

    const sizeItems =
      items.filter(
        function(item) {

          return (
            getProductSize(
              item.name
            ) ===
            requestedSize
          );

        }
      );


    if (
      sizeItems.length === 1
    ) {

      return sizeItems[0];

    }


    if (
      bestItem &&
      getProductSize(
        bestItem.name
      ) ===
      requestedSize
    ) {

      return bestItem;

    }

  }


  if (
    bestItem &&
    (
      bestScore >= 0.55 ||
      productAlias
    )
  ) {

    return bestItem;

  }


  return null;

}

// ==========================================================
// 📏 음성 제품 규격
// ==========================================================

function getSpokenProductSize(
  text
) {

  const normalized =
    normalizeSpeechText(
      text
    );


  if (
    /12(?:kg|키로|킬로|키로그램|킬로그램)/i.test(
      normalized
    ) ||
    normalized.includes(
      '십이키로'
    ) ||
    normalized.includes(
      '십이킬로'
    ) ||
    normalized.includes(
      '십이킬로그램'
    ) ||
    normalized.includes(
      '십이키로그램'
    )
  ) {

    return 12;

  }


  if (
    /15(?:kg|키로|킬로|키로그램|킬로그램)/i.test(
      normalized
    ) ||
    normalized.includes(
      '십오키로'
    ) ||
    normalized.includes(
      '십오킬로'
    ) ||
    normalized.includes(
      '십오킬로그램'
    ) ||
    normalized.includes(
      '십오키로그램'
    )
  ) {

    return 15;

  }


  if (
    /20(?:kg|키로|킬로|키로그램|킬로그램)/i.test(
      normalized
    ) ||
    normalized.includes(
      '이십키로'
    ) ||
    normalized.includes(
      '이십킬로'
    ) ||
    normalized.includes(
      '이십킬로그램'
    ) ||
    normalized.includes(
      '이십키로그램'
    )
  ) {

    return 20;

  }


  return '';

}

// 🔎 상품 찾기

function findItemByKeyword(

) {

  const targetSize =

    itemId:
      itemId,

    quantity:
      quantity,

    date:
      date,

    memo:
      memo ||
      ''

  });


  showStep2();

}


// ==========================================================
// STEP 2 값 넣기
// ==========================================================

function fillStep2(
  data
) {

  if (
    data.type
  ) {

    setType(
      data.type
    );

  }


  document
    .getElementById(
      'partnerSelect'
    )
    .value =
      data.partnerId || '';


  if (
    !document
      .getElementById(
        'partnerSelect'
      )
      .value &&
    (
      data.type ||
      selectedType
    ) === 'in'
  ) {

    const defaultPartner =
      findDefaultInboundPartner();

    if (
      defaultPartner
    ) {

      document
        .getElementById(
          'partnerSelect'
        )
        .value =
          defaultPartner.id;

    }

  }


  document
    .getElementById(
      'itemSelect'
    )
    .value =
      data.itemId || '';


  if (
    !document
      .getElementById(
        'itemSelect'
      )
      .value
  ) {

    const defaultItem =
      findDefault15KgItem();

    if (
      defaultItem
    ) {

      document
        .getElementById(
          'itemSelect'
        )
        .value =
          defaultItem.id;

    }

  }


  document
    .getElementById(
      'quantityInput'
    )
    .value =
      data.quantity || 1;


  document
    .getElementById(
      'typeSelect'
    )
    .value =
      data.type ||
      selectedType;


  document
    .getElementById(
      'dateInput'
    )
    .value =
      data.date ||
      getTodayLocal();


  document
    .getElementById(
      'deliveryTypeSelect'
    )
    .value =
      data.deliveryType || '';


  document
    .getElementById(
      'memoInput'
    )
    .value =
      data.deliveryType
        ? data.deliveryType
        : (
            data.memo || ''
          );


  if (
    data.deliveryType &&
    !data.memo
  ) {

    document
      .getElementById(
        'memoInput'
      )
      .value =
        data.deliveryType;

  }


  updateSelectedClient();

  updatePartnerSearchText();

  updateSummary();

}

// ==========================================================
// ⭐ 거래처 선택 화면 열기
//
// STEP 2 → 별도 화면
//
// history.pushState를 사용하기 때문에
// 갤럭시 뒤로가기 버튼을 누르면 STEP 2로 돌아옵니다.
// ==========================================================

function openPartnerPicker() {

  if (
    partnerPickerOpen
  ) {

    return;

  }


  partnerPickerOpen =
    true;


  /*
   * 현재 STEP 2 상태 위에
   * 거래처 선택 화면이라는 history entry를 하나 추가합니다.
   */

  history.pushState(
    {
      partnerPicker:
        true
    },
    '',
    '#partner-picker'
  );


  document
    .getElementById(
      'step2'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'partnerPicker'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .body
    .classList
    .add(
      'step2-mode'
    );


  renderPartnerPickerCandidates(
    ''
  );


  const search =
    document
      .getElementById(
        'partnerPickerSearch'
      );


  if (
    search
  ) {

    search.value =
      '';


    /*
     * 화면이 열린 다음 포커스를 줍니다.
     * 모바일 키보드가 자동으로 튀어나오는 것을
     * 막기 위해 setTimeout 없이 focus하지 않습니다.
     */

  }


  window.scrollTo({

    top:
      0,

    behavior:
      'instant'

  });

}


// ==========================================================
// ⭐ 거래처 선택 화면 닫기
//
// fromPopState = true
// → 갤럭시 뒤로가기 때문에 호출된 경우
//
// fromPopState = false
// → 화면의 ← 버튼을 눌렀거나 코드에서 직접 닫은 경우
// ==========================================================

function closePartnerPicker(
  fromPopState
) {

  if (
    !partnerPickerOpen
  ) {

    return;

  }


  /*
   * 화면의 ← 버튼을 눌렀을 경우에는
   * 현재 history entry를 직접 뒤로 이동합니다.
   *
   * 그러면 popstate가 발생하고
   * 아래 로직이 다시 실행됩니다.
   */

  if (
    !fromPopState
  ) {
    history.back();

    return;
  }


  partnerPickerOpen =
    false;


  document
    .getElementById(
      'partnerPicker'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'step2'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .body
    .classList
    .add(
      'step2-mode'
    );


  updateSelectedClient();

  updatePartnerSearchText();

  updateSummary();


  window.scrollTo({

    top:
      0,

    behavior:
      'instant'

  });

}


// ==========================================================
// ⭐ 새로운 거래처 선택 화면 검색 초기화
// ==========================================================

function setupPartnerPickerSearch() {

  const input =
    document
      .getElementById(
        'partnerPickerSearch'
      );


  if (
    !input
  ) {

// ==========================================================
// ⭐ 새로운 거래처 선택 화면 거래처 목록
// ==========================================================

function renderPartnerPickerCandidates(
  keyword
) {

  const container =
    document
      .getElementById(
        'partnerPickerCandidates'
      );


  const count =
    document
      .getElementById(
        'partnerPickerCount'
      );


  if (
    !container
  ) {

    return;

  }


  const normalized =
    String(
      keyword || ''
    )
      .trim()
      .toLowerCase();


  const currentPartnerId =
    document
      .getElementById(
        'partnerSelect'
      )
      .value;


  const partners =
    [...masterData.partners]
      .filter(
        function(partner) {

          if (
            !normalized
          ) {

            return true;

          }


          return String(
            partner.name || ''
          )
            .toLowerCase()
            .includes(
              normalized
            );

        }
      )
      .sort(
        function(a, b) {

          return String(
            a.name
          ).localeCompare(
            String(
              b.name
            ),
            'ko'
          );

        }
      );


  container.innerHTML =
    '';


  if (
    count
  ) {

    count.textContent =
      partners.length +
      '개 거래처';

  }


  if (
    partners.length === 0
  ) {

    const empty =
      document.createElement(
        'div'
      );


    empty.className =
      'partner-picker-empty';


    empty.textContent =
      '검색되는 거래처가 없습니다.';


    container.appendChild(
      empty
    );


    return;

  }


  partners.forEach(
    function(partner) {

      const button =
        document.createElement(
          'button'
        );


      button.type =
        'button';


      button.className =
        'partner-picker-candidate';


      if (
        String(
          partner.id
        ) ===
        String(
          currentPartnerId
        )
      ) {

        button.classList.add(
          'selected'
        );

      }


      button.textContent =
        partner.name;


      button.addEventListener(
        'click',
        function() {

          selectPartnerFromPicker(
            partner.id
          );

        }
      );


      container.appendChild(
        button
      );

    }
  );

}


// ==========================================================
// ⭐ 새로운 거래처 선택 화면에서 거래처 선택
// ==========================================================

function selectPartnerFromPicker(
  partnerId
) {

  document
    .getElementById(
      'partnerSelect'
    )
    .value =
      partnerId;


  updateSelectedClient();

  updatePartnerSearchText();

  updateSummary();


  /*
   * 거래처를 선택했으므로
   * 거래처 선택 화면을 닫고 STEP 2로 돌아갑니다.
   *
   * history.back()을 사용하지 않고
   * history 상태를 정리한 뒤 STEP 2로 돌아갑니다.
   */

  partnerPickerOpen =
    false;


  /*
   * 현재 #partner-picker history entry 제거
   *
   * replaceState를 사용하여
   * 불필요한 hash가 남지 않도록 합니다.
   */

  history.replaceState(
    null,
    '',
    window.location.pathname +
    window.location.search
  );


  document
    .getElementById(
      'partnerPicker'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'step2'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .body
    .classList
    .add(
      'step2-mode'
    );


  window.scrollTo({

    top:
      0,

    behavior:
      'instant'

  });

}

// STEP 2에서는 후보 목록을 보여주지 않고

// ==========================================================
// 🔍 기존 거래처 검색 버튼
//
// 현재 UI에서는 거래처 선택 화면을 사용하므로
// 기존 검색 기능과의 충돌을 방지합니다.
// ==========================================================

function activatePartnerSearch() {

  /*
   * ======================================================
   * ⭐ [ 거래처 검색 ] 버튼
   *
   * 화면을 이동하지 않고
   * STEP 2 안에서만 검색창을 열고 닫습니다.
   *
   * 전체 화면 거래처 선택 화면과 history.pushState 는
   * [ 거래처 선택 ] 버튼만 사용합니다.
   * ======================================================
   */

  const step2 =
    document
      .getElementById(
        'step2'
      );


  if (
    !step2
  ) {

    return;

  }


  const wrap =
    step2
      .querySelector(
        '.client-search-wrap'
      );


  if (
    !wrap
  ) {

    return;

  }


  const input =
    document
      .getElementById(
        'partnerSearch'
      );


  const container =
    document
      .getElementById(
        'clientCandidates'
      );


  wrap
    .classList
    .toggle(
      'search-open'
    );


  if (
    container
  ) {

    container.innerHTML =
      '';

  }


  if (
    wrap
      .classList
      .contains(
        'search-open'
      )
  ) {

    if (
      input
    ) {

      input
        .focus();

    }

  }

}

// ==========================================================
// 🚚 납품형태 → 메모 자동 반영
// ==========================================================

function applyDeliveryTypeToMemo() {

  const deliveryType =
    document
      .getElementById(
        'deliveryTypeSelect'
      )
      .value;


  const memoInput =
    document
      .getElementById(
        'memoInput'
      );


  const currentMemo =
    memoInput
      .value
      .trim();


  const cleanedMemo =
    currentMemo
      .replace(
        /^(택배 발송|본사 발송|창고 수령)\s*(\/\s*)?/,
        ''
      )
      .trim();


  if (
    deliveryType
  ) {

    memoInput.value =
      deliveryType +
      (
        cleanedMemo
          ? ' / ' +
            cleanedMemo
          : ''
      );

  } else {

    memoInput.value =
      cleanedMemo;

  }


  updateSummary();

}

document.addEventListener(

    ) {

      updateSelectedClient();

      updatePartnerSearchText();

      updateSummary();

    }


    if (
      event.target.id ===
      'itemSelect' ||

      event.target.id ===
      'quantityInput' ||

      event.target.id ===
      'typeSelect' ||

      event.target.id ===
      'dateInput' ||

      event.target.id ===
      'deliveryTypeSelect'
    ) {

      if (
        event.target.id ===
        'typeSelect'
      ) {

        selectedType =
          event.target.value;


        setType(
          selectedType
        );

      }


      if (
        event.target.id ===
        'deliveryTypeSelect'
      ) {

        applyDeliveryTypeToMemo();

      }


      updateSummary();

    }

  }
);


// ==========================================================
// 🚀 실제 BoxHero 등록
// ==========================================================

function registerTransaction() {

  const partnerId =
    document
      .getElementById(
        'partnerSelect'
      )
      .value;


  const itemId =
    document
      .getElementById(
        'itemSelect'
      )
      .value;


  const quantity =
    Number(
      document
        .getElementById(
          'quantityInput'
        )
        .value
    );


  const type =
    document
      .getElementById(
        'typeSelect'
      )
      .value;


  const date =
    document
      .getElementById(
        'dateInput'
      )
      .value;


  const deliveryType =
    document
      .getElementById(
        'deliveryTypeSelect'
      )
      .value;


  let memo =
    document
      .getElementById(
        'memoInput'
      )
      .value
      .trim();


  if (
    !partnerId
  ) {

    alert(
      '거래처를 선택해주세요.'
    );

    return;

  }


  if (
    !itemId
  ) {

    alert(
      '제품을 선택해주세요.'
    );

    return;

  }


  if (
    !quantity ||
    quantity <= 0
  ) {

    alert(
      '수량을 확인해주세요.'
    );

    return;

  }


  if (
    !date
  ) {

    alert(
      '날짜를 선택해주세요.'
    );

    return;

  }


  const location =
    masterData.locations[0];


  if (
    !location
  ) {

    alert(
      'BoxHero 위치 정보를 찾을 수 없습니다.'
    );

    return;

  }


  const transactionDateTime =
    combineDateAndTime(
      date
    );


  if (
    deliveryType &&
    !memo
  ) {

    memo =
      deliveryType;

  }


  const finalMemo =
    [
      '푸로찜 에스 음성입출고',

      '날짜=' +
      transactionDateTime,

      memo
        ? '메모=' +
          memo
        : ''

    ]
      .filter(
        function(value) {

          return value !== '';

        }
      )
      .join(
        ' / '
      );


  const registerButton =
    document
      .getElementById(
        'registerButton'
      );


  registerButton.disabled =
    true;


  showLoading(
    'BoxHero에 실제 재고를 등록하고 있습니다...'
  );


  callGas(
    'registerBoxHeroTransaction',
    {

      type:
        type,

      partnerId:
        partnerId,

      itemId:
        itemId,

      locationId:
        location.id,

      quantity:
        quantity,

      transactionDate:
        transactionDateTime,

      memo:
        finalMemo

    }
  )
    .then(
      function(result) {

        hideLoading();

        registerButton.disabled =
          false;

        showResult(
          result
        );

      }
    )
    .catch(
      function(error) {

        hideLoading();

        registerButton.disabled =
          false;

        alert(
          'BoxHero 등록에 실패했습니다.\n\n' +
          getErrorMessage(error)
        );

      }
    );

}


// ==========================================================
// 🎉 등록 완료
// ==========================================================

function showResult(
  result
) {

  const typeText =
    result.type === 'in'
      ? '📥 입고'
      : '📤 출고';


  const quantity =
    result.quantity;


  const date =
    result.transactionDate ||
    '';


  const partner =
    masterData.partners.find(
      function(item) {

        return String(
          item.id
        ) ===
        String(
          result.partnerId
        );

      }
    );


  const product =
    masterData.items.find(
      function(item) {

        return String(
          item.id
        ) ===
        String(
          result.itemId
        );

      }
    );


  document
    .getElementById(
      'resultText'
    )
    .innerHTML =

      typeText +
      '<br>' +

      '거래처: <strong>' +
      (
        partner
          ? escapeHtml(
              partner.name
            )
          : ''
      ) +
      '</strong><br>' +

      '제품: <strong>' +
      (
        product
          ? escapeHtml(
              product.name
            )
          : ''
      ) +
      '</strong><br>' +

      '수량: <strong>' +
      quantity +
      '개</strong><br>' +

      '날짜: <strong>' +
      escapeHtml(
        date
      ) +
      '</strong><br><br>' +

      'BoxHero 거래 ID<br>' +

      '<strong>' +
      escapeHtml(
        String(
          result.transactionId ||
          ''
        )
      ) +
      '</strong>';


  document
    .getElementById(
      'step2'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'partnerPicker'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'result'
    )
    .classList
    .remove(
      'hidden'
    );


  partnerPickerOpen =
    false;


  window.scrollTo({

    top:
      0,

    behavior:
      'smooth'

  });

}

// ==========================================================
// ❗ 오류 메시지
// ==========================================================

function getErrorMessage(
  error
) {

  if (
    !error
  ) {

    return '알 수 없는 오류';

  }


  if (
    typeof error ===
    'string'
  ) {

    return error;

  }


  return (
    error.message ||
    JSON.stringify(
      error
    )
  );

}


// ==========================================================
// 🔐 HTML escape
// ==========================================================

function escapeHtml(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}
