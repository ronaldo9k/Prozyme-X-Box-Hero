<!DOCTYPE html>

<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070b"
  >

<link rel="manifest" href="./manifest.json">

  <!-- 🐐 Ronaldo 앱 아이콘 -->
  <link
    rel="icon"
    type="image/png"
    href="./Ronaldo.png"
  >

  <link
    rel="apple-touch-icon"
    href="./Ronaldo.png"
  >
  
  <title>
    푸로찜에스 X 박스히어로
  </title>

  <style>

    /* ======================================================
       🎨 기본 색상
       ====================================================== */

    :root {

      --bg:
        #05070b;

      --card:
        rgba(10,15,25,.42);

      --text:
        #111827;

      --muted:
        #6b7280;

      --line:
        #e5e7eb;

      --green:
        #15803d;

      --red:
        #dc2626;

      --dark:
        #111827;

      --gold:
        #c9a227;

    }


    /* ======================================================
       🔧 기본
       ====================================================== */

    * {

      box-sizing:
        border-box;

    }


    html {

      scroll-behavior:
        smooth;

    }


    body {

      margin:
        0;

      /*
       * ======================================================
       * 🐐 Fenomeno.png 전체 배경화면
       *
       * GitHub Pages 프로젝트:
       * /Prozyme-X-Box-Hero/
       * ======================================================
       */

      background-color:
        #05070b;

      background-image:
        url('/Prozyme-X-Box-Hero/Fenomeno.png');

      background-size:
        cover;

      background-position:
        center;

      background-repeat:
        no-repeat;

      background-attachment:
        fixed;

      padding:
        0 14px 30px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

      color:
        var(--text);

      min-height:
        100vh;

      position:
        relative;

      overflow-x:
        hidden;

    }


    /* ======================================================
       ⭐ STEP 2에서는 Fenomeno 배경을 완전히 제거
       ⭐ 화면 맨 위부터 흰색
       ====================================================== */

    body.step2-mode {

      background-color:
        #ffffff;

      background-image:
        none;

      padding:
        0 14px 30px;

    }


    body.step2-mode::before,
    body.step2-mode::after {

      background:
        transparent;

    }


    body::before {

      content:
        "";

      position:
        fixed;

      inset:
        0;

      /*
       * 첫 화면 Fenomeno 위에 아주 약한 어두움만 유지합니다.
       * 기존보다 훨씬 자연스럽게 보이도록 조정했습니다.
       */

      background:
        linear-gradient(
          rgba(0,0,0,.04),
          rgba(0,0,0,.10)
        );

      pointer-events:
        none;

      z-index:
        0;

    }


    body::after {

      content:
        "";

      position:
        fixed;

      inset:
        0;

      background:
        transparent;

      pointer-events:
        none;

      z-index:
        0;

    }


    .container {

      max-width:
        560px;

      margin:
        0 auto;

      position:
        relative;

      z-index:
        1;

    }


    .screen {

      width:
        100%;

    }


    .step-hidden {

      display:
        none !important;

    }


    /* ======================================================
       🏆 HERO
       ====================================================== */

    .hero {

      height:
        285px;

      border-radius:
        0 0 30px 30px;

      overflow:
        hidden;

      position:
        relative;

      display:
        flex;

      align-items:
        flex-end;

      justify-content:
        flex-start;

      margin:
        0 -14px 18px;

      /*
       * ⭐ 완전 투명
       * Fenomeno.png가 그대로 보입니다.
       */

      background:
        transparent;

      box-shadow:
        none;

    }


    .hero::before {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      background:
        transparent;

      pointer-events:
        none;

    }


    .hero::after {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      background:
        transparent;

      pointer-events:
        none;

    }


    .hero-content {

      position:
        relative;

      z-index:
        2;

      width:
        100%;

      text-align:
        left;

      /*
       * ⭐ 기존 BOXHERO 글자가 시작하던 위치보다
       * 조금 더 자연스럽게 왼쪽에 배치
       */

      padding:
        0 28px 45px;

    }


    /* ======================================================
       ⭐ 왕군
       ====================================================== */

    .hero-kicker {

      font-size:
        15px;

      font-weight:
        950;

      letter-spacing:
        1px;

      color:
        #f0c83d;

      margin-bottom:
        8px;

      text-shadow:
        0 2px 10px
        rgba(0,0,0,.75);

    }


    /* ======================================================
       ⭐ 왕관
       ====================================================== */

    .hero-symbol {

      font-size:
        20px;

      color:
        #e0b52c;

      margin:
        0 0 5px;

      text-shadow:
        0 2px 9px
        rgba(0,0,0,.75);

    }


    /* ======================================================
       ⭐ 메인 제목
       ====================================================== */

    .hero-title {

      font-size:
        28px;

      line-height:
        1.15;

      font-weight:
        950;

      letter-spacing:
        -1.2px;

      color:
        white;

      text-shadow:
        0 3px 15px
        rgba(0,0,0,.70);

    }


    /* ======================================================
       ⭐ 가족 이름
       ====================================================== */

    .hero-sub {

      margin-top:
        11px;

      font-size:
        14px;

      font-weight:
        800;

      color:
        #ffffff;

      letter-spacing:
        .3px;

      text-shadow:
        0 2px 10px
        rgba(0,0,0,.80);

    }


    /* ======================================================
       🔢 STEP INDICATOR
       ====================================================== */

    .step-indicator {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        8px;

      margin:
        0 0 15px;

    }


    .step-dot {

      width:
        9px;

      height:
        9px;

      border-radius:
        50%;

      background:
        rgba(255,255,255,.45);

    }


    .step-dot.active {

      width:
        11px;

      height:
        11px;

      background:
        var(--gold);

      box-shadow:
        0 0 0 4px
        rgba(201,162,39,.13);

    }


    .step-line {

      width:
        38px;

      height:
        1px;

      background:
        rgba(255,255,255,.45);

    }


    /*
     * ======================================================
     * ⭐ STEP 2의 흰색 영역에서는
     * STEP 표시선도 밝은 회색으로 변경
     * ======================================================
     */

    body.step2-mode .step-dot {

      background:
        #d1d5db;

    }


    body.step2-mode .step-dot.active {

      background:
        var(--gold);

    }


    body.step2-mode .step-line {

      background:
        #d1d5db;

    }


    /* ======================================================
       🃏 CARD
       ====================================================== */

    .card {

      /*
       * ⭐ 첫 화면에서는 Fenomeno가 비쳐 보이는
       * 반투명 유리 카드
       */

      background:
        rgba(10,15,25,.48);

      border:
        1px solid
        rgba(255,255,255,.18);

      border-radius:
        22px;

      padding:
        21px;

      margin-bottom:
        16px;

      box-shadow:
        0 18px 50px
        rgba(0,0,0,.30);

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);

    }


    /*
     * ======================================================
     * ⭐ STEP 2 카드는 완전한 흰색
     * ======================================================
     */

    body.step2-mode .card {

      background:
        #ffffff;

      border:
        1px solid
        #e5e7eb;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.06);

      backdrop-filter:
        none;

      -webkit-backdrop-filter:
        none;

    }


    .card-title {

      font-size:
        19px;

      font-weight:
        900;

      margin-bottom:
        17px;

      letter-spacing:
        -.5px;

      color:
        white;

      text-shadow:
        0 2px 8px
        rgba(0,0,0,.45);

    }


    body.step2-mode .card-title {

      color:
        #111827;

      text-shadow:
        none;

    }


    .card-subtitle {

      color:
        rgba(255,255,255,.72);

      font-size:
        13px;

      margin:
        -8px 0 17px;

      line-height:
        1.5;

    }


    /* ======================================================
       📥📤 입출고 선택
       ====================================================== */

    .mode-buttons {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        10px;

      margin-bottom:
        17px;

    }


    .mode-button {

      border:
        1px solid
        transparent;

      border-radius:
        16px;

      padding:
        15px 10px;

      font-size:
        16px;

      font-weight:
        900;

      cursor:
        pointer;

      transition:
        .18s;

    }


    .mode-button.in {

      background:
        #ecfdf3;

      color:
        var(--green);

    }


    .mode-button.out {

      background:
        #fff1f2;

      color:
        var(--red);

    }


    .mode-button.active {

      box-shadow:
        0 0 0 3px
        currentColor;

    }


    /* ======================================================
       🎙️ 음성 영역
       ====================================================== */

    .voice-area {

      text-align:
        center;

      padding:
        8px 4px 5px;

    }


    .main-buttons {

      display:
        flex;

      justify-content:
        center;

      gap:
        10px;

    }


    .main-button {

      width:
        170px;

      height:
        56px;

      border:
        1px solid
        rgba(201,162,39,.75);

      border-radius:
        17px;

      color:
        white;

      background:
        linear-gradient(
          135deg,
          #111827,
          #252c3a
        );

      font-size:
        15px;

      font-weight:
        900;

      cursor:
        pointer;

      box-shadow:
        0 9px 25px
        rgba(0,0,0,.20);

      transition:
        .18s;

    }


    .main-button:hover {

      transform:
        translateY(-1px);

    }


    .main-button:disabled {

      opacity:
        .48;

      cursor:
        not-allowed;

      transform:
        none;

    }


    .main-button.finish {

      background:
        linear-gradient(
          135deg,
          #c9a227,
          #a88414
        );

      color:
        #111827;

    }


    .main-button-label {

      display:
        inline-block;

      margin-left:
        4px;

    }


    .voice-status {

      margin-top:
        13px;

      font-size:
        13px;

      color:
        var(--muted);

      min-height:
        20px;

    }


    .timer {

      margin-top:
        4px;

      font-size:
        12px;

      color:
        var(--muted);

      min-height:
        17px;

    }


    /* ======================================================
       🎙️ 음성 인식 결과
       
       ⭐ 메인 버튼과 동일한 56px 높이
       ⭐ 두께/테두리/모서리도 통일
       ====================================================== */

    .recognized-text {

      margin-top:
        13px;

      height:
        56px;

      min-height:
        56px;

      padding:
        0 15px;

      background:
        #f8fafc;

      border:
        1px solid
        #e5e7eb;

      border-radius:
        17px;

      font-size:
        14px;

      line-height:
        1.45;

      text-align:
        left;

      display:
        flex;

      align-items:
        center;

      white-space:
        pre-wrap;

      word-break:
        break-word;

      overflow:
        hidden;

    }


    /* ======================================================
       ✏️ 직접 입력 버튼
       ====================================================== */

    .direct-button {

      width:
        100%;

      margin-top:
        12px;

      border:
        1px solid
        #d9dde5;

      border-radius:
        15px;

      padding:
        14px;

      background:
        white;

      color:
        #374151;

      font-size:
        15px;

      font-weight:
        800;

      cursor:
        pointer;

    }


    /* ======================================================
       📝 STEP 2 HEADER
       ====================================================== */

    .preview-header {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        7px;

      margin-bottom:
        14px;

    }


    .preview-actions {

      display:
        flex;

      align-items:
        center;

      gap:
        5px;

      width:
        100%;

    }


    .preview-action-button {

      flex:
        1;

      min-width:
        0;

      border:
        1px solid
        #e1e4e9;

      border-radius:
        11px;

      padding:
        9px 7px;

      background:
        white;

      color:
        #374151;

      font-size:
        12px;

      font-weight:
        800;

      white-space:
        nowrap;

      cursor:
        pointer;

    }


    .preview-step-label {

      flex:
        0 0 auto;

      color:
        #9ca3af;

      font-size:
        11px;

      font-weight:
        900;

      padding-left:
        2px;

    }


    /* ======================================================
       🏢 거래처 검색
       ====================================================== */

    .client-search-wrap {

      position:
        relative;

    }


    .client-search-buttons {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        7px;

      margin-bottom:
        8px;

    }


    .client-search-button {

      border:
        1px solid
        #dfe3e8;

      border-radius:
        12px;

      padding:
        11px 8px;

      background:
        white;

      color:
        #374151;

      font-size:
        13px;

      font-weight:
        800;

      cursor:
        pointer;

    }


    .client-search-button.active {

      border-color:
        var(--gold);

      background:
        #fffdf4;

      box-shadow:
        0 0 0 3px
        rgba(201,162,39,.10);

    }


    .client-search-row {

      display:
        grid;

      grid-template-columns:
        1fr;

      gap:
        8px;

    }


    .client-search {

      position:
        relative;

    }


    .client-search-icon {

      position:
        absolute;

      left:
        13px;

      top:
        50%;

      transform:
        translateY(-50%);

      font-size:
        15px;

      z-index:
        1;

    }


    .client-search input {

      padding-left:
        39px;

    }


    .client-candidates {

      margin-top:
        7px;

      max-height:
        180px;

      overflow-y:
        auto;

      border-radius:
        13px;

    }


    .client-candidate {

      padding:
        11px 13px;

      border:
        1px solid
        #e5e7eb;

      border-bottom:
        none;

      background:
        white;

      cursor:
        pointer;

      font-size:
        14px;

    }


    .client-candidate:last-child {

      border-bottom:
        1px solid
        #e5e7eb;

    }


    .client-candidate:hover {

      background:
        #f8fafc;

    }


    .selected-client {

      margin-top:
        8px;

      padding:
        11px 13px;

      background:
        #ecfdf3;

      border:
        1px solid
        #bbf7d0;

      color:
        #166534;

      border-radius:
        12px;

      font-size:
        13px;

      font-weight:
        800;

    }


    /* ======================================================
       🏷️ FIELD
       ====================================================== */

    .field {

      margin-bottom:
        16px;

    }


    .field:last-child {

      margin-bottom:
        0;

    }


    .field-label {

      display:
        block;

      font-size:
        13px;

      font-weight:
        900;

      margin-bottom:
        7px;

      color:
        #4b5563;

    }


    select,
    input,
    textarea {

      width:
        100%;

      border:
        1px solid
        #dfe3e8;

      border-radius:
        14px;

      padding:
        13px;

      font-size:
        17px;

      background:
        white;

      color:
        #111827;

      outline:
        none;

    }


    select:focus,
    input:focus,
    textarea:focus {

      border-color:
        var(--gold);

      box-shadow:
        0 0 0 3px
        rgba(201,162,39,.12);

    }


    input[type="date"] {

      min-height:
        49px;

    }


    textarea {

      min-height:
        85px;

      resize:
        vertical;

      line-height:
        1.55;

    }


    .product-help {

      margin-top:
        7px;

      color:
        #9ca3af;

      font-size:
        11px;

    }


    /* ======================================================
       📊 SUMMARY
       ====================================================== */

    .summary {

      background:
        #f8fafc;

      border:
        1px solid
        #e5e7eb;

      border-radius:
        16px;

      padding:
        15px;

      margin-top:
        17px;

      line-height:
        1.85;

      font-size:
        14px;

    }


    .summary strong {

      font-weight:
        900;

    }


    /* ======================================================
       🚀 BUTTON
       ====================================================== */

    .primary-button {

      width:
        100%;

      border:
        1px solid
        rgba(201,162,39,.75);

      border-radius:
        16px;

      padding:
        16px;

      background:
        linear-gradient(
          135deg,
          #111827,
          #252c3a
        );

      color:
        white;

      font-size:
        16px;

      font-weight:
        900;

      cursor:
        pointer;

      margin-top:
        17px;

      box-shadow:
        0 10px 25px
        rgba(0,0,0,.15);

    }


    .primary-button:disabled {

      opacity:
        .45;

      cursor:
        not-allowed;

    }


    .secondary-button {

      width:
        100%;

      border:
        1px solid
        #d8dce3;

      border-radius:
        15px;

      padding:
        14px;

      background:
        white;

      color:
        #374151;

      font-size:
        15px;

      font-weight:
        800;

      cursor:
        pointer;

      margin-top:
        10px;

    }


    /* ======================================================
       ⏳ LOADING
       ====================================================== */

    .loading {

      text-align:
        center;

      padding:
        30px 10px;

      color:
        var(--muted);

    }


    .spinner {

      width:
        36px;

      height:
        36px;

      border:
        4px solid
        #e5e7eb;

      border-top-color:
        var(--gold);

      border-radius:
        50%;

      animation:
        spin .8s
        linear infinite;

      margin:
        0 auto 13px;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* ======================================================
       🎉 RESULT
       ====================================================== */

    .result {

      text-align:
        center;

      padding:
        20px 7px 7px;

    }


    .result-icon {

      font-size:
        58px;

      margin-bottom:
        10px;

    }


    .result-title {

      font-size:
        24px;

      font-weight:
        950;

    }


    .result-text {

      margin-top:
        12px;

      color:
        #6b7280;

      line-height:
        1.85;

      font-size:
        14px;

    }


    .hidden {

      display:
        none !important;

    }


    /* ======================================================
       📱 모바일
       ====================================================== */

    @media (
      max-width: 500px
    ) {

      body {

        padding:
          0 10px 25px;

      }


      body.step2-mode {

        padding:
          0 10px 25px;

      }


      .container {

        max-width:
          100%;

      }


      .hero {

        margin:
          0 -10px 16px;

        height:
          270px;

        border-radius:
          0 0 27px 27px;

      }


      .hero-content {

        padding:
          0 22px 40px;

      }


      .hero-kicker {

        font-size:
          15px;

      }


      .hero-title {

        font-size:
          25px;

      }


      .hero-sub {

        font-size:
          13px;

      }


      .card {

        padding:
          17px;

        border-radius:
          19px;

      }


      .main-buttons {

        gap:
          7px;

      }


      .main-button {

        width:
          50%;

        height:
          54px;

        font-size:
          14px;

      }


      .recognized-text {

        height:
          54px;

        min-height:
          54px;

        border-radius:
          16px;

      }


      .preview-actions {

        gap:
          4px;

      }


      .preview-action-button {

        padding:
          9px 5px;

        font-size:
          12px;

      }


      .preview-step-label {

        display:
          none;

      }

    }


    @media (
      max-width: 420px
    ) {

      .preview-action-button {

        font-size:
          13px;

        padding:
          8px 4px;

      }


      select,
      input,
      textarea {

        font-size:
          16px;

      }

    }

  </style>

</head>

<body>

<div class="container">

  <!-- =====================================================
       🏆 HERO
       ====================================================== -->

  <div class="hero">

// ==========================================================
// 🌐 GitHub Pages → GAS Web App
// ==========================================================

const GAS_WEB_APP_URL =
  'https://script.google.com/macros/s/AKfycbzZX1JoVHJ07jFBKY6qH0UNcXHIulQuha6t7JnYfUymh8UKkwfpV0miwsAY_ud4WKvc/exec';


// ==========================================================
// 📡 GAS Web App 호출
// ==========================================================

async function callGas(
  action,
  data
) {

  if (
    !GAS_WEB_APP_URL ||
    GAS_WEB_APP_URL.includes(
      '여기에_실제_GAS'
    )
  ) {

    throw new Error(
      'GAS_WEB_APP_URL이 아직 설정되지 않았습니다.'
    );

  }


  const response =
    await fetch(
      GAS_WEB_APP_URL,
      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify({

            action:
              action,

            data:
              data || {}

          })

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      'GAS Web App HTTP 오류: ' +
      response.status
    );

  }


  const result =
    await response.json();


  if (
    result &&
    result.ok === false
  ) {

    throw new Error(
      result.message ||
      'GAS Web App에서 오류가 발생했습니다.'
    );

  }


  return (
    result &&
    Object.prototype.hasOwnProperty.call(
      result,
      'data'
    )
      ? result.data
      : result
  );

}

// ==========================================================
// 📅 오늘 날짜

function getTodayLocal() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      '0'
    );

  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      '0'
    );

  return (
    year +
    '-' +
    month +
    '-' +
    day
  );

}


// ==========================================================
// ⏰ 현재 시간
// ==========================================================

function getCurrentTimeLocal() {

  const now =
    new Date();

  const hours =
    String(
      now.getHours()
    ).padStart(
      2,
      '0'
    );

  const minutes =
    String(
      now.getMinutes()
    ).padStart(
      2,
      '0'
    );

  const seconds =
    String(
      now.getSeconds()
    ).padStart(
      2,
      '0'
    );

  return (
    hours +
    ':' +
    minutes +
    ':' +
    seconds
  );

}


// ==========================================================
// 📅 날짜 + 시간 만들기
// ==========================================================

function combineDateAndTime(
  date
) {

  const selectedDate =
    String(
      date ||
      getTodayLocal()
    ).trim();


  const time =
    transactionTime ||
    getCurrentTimeLocal();


  return (
    selectedDate +
    ' ' +
    time
  );

}

// ==========================================================
// 👥 거래처 SELECT
// ==========================================================

function populatePartnerSelects() {

  const selects = [

    document.getElementById(
      'partnerSelect'
    ),

    document.getElementById(
      'directPartner'
    )

  ];


  selects.forEach(
    function(select) {

      if (!select) {

        return;

      }


      select.innerHTML =
        '<option value="">거래처를 선택하세요</option>';


      const partners =
        [...masterData.partners]
          .sort(
            function(a, b) {

              return String(
                a.name
              ).localeCompare(
                String(
                  b.name
                ),
                'ko'
              );

            }
          );


      partners.forEach(
        function(partner) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            partner.id;


          option.textContent =
            partner.name;


          select.appendChild(
            option
          );

        }
      );

    }
  );

}


// ==========================================================
// 📦 상품 SELECT
// ==========================================================

function populateItemSelects() {

  const selects = [

    document.getElementById(
      'itemSelect'
    ),

    document.getElementById(
      'directItem'
    )

  ];


  selects.forEach(
    function(select) {

      if (!select) {

        return;

      }


      select.innerHTML =
        '<option value="">제품을 선택하세요</option>';


      const items =
        [...masterData.items]
          .filter(
            function(item) {

              const name =
                String(
                  item.name || ''
                );

              return (
                name.includes(
                  '푸로찜'
                ) &&
                (
                  getProductSize(
                    name
                  ) === 12 ||
                  getProductSize(
                    name
                  ) === 15 ||
                  getProductSize(
                    name
                  ) === 20
                )
              );

            }
          )
          .sort(
            function(a, b) {

              const aSize =
                getProductSize(
                  a.name
                );

              const bSize =
                getProductSize(
                  b.name
                );


              const order = {

                15: 1,

                20: 2,

                12: 3

              };


              const aOrder =
                order[aSize] || 99;

              const bOrder =
                order[bSize] || 99;


              if (
                aOrder !==
                bOrder
              ) {

                return (
                  aOrder -
                  bOrder
                );

              }


              return String(
                a.name
              ).localeCompare(
                String(
                  b.name
                ),
                'ko'
              );

            }
          );


      items.forEach(
        function(item) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            item.id;


          option.textContent =
            item.name;


          select.appendChild(
            option
          );

        }
      );

    }
  );

}


// ==========================================================
// 📏 제품 규격
// ==========================================================

function getProductSize(
  productName
) {

  const text =
    normalizeSpeechText(
      productName
    );


  if (
    /12(?:kg|키로|킬로)/i.test(
      text
    ) ||
    text.includes(
      '12'
    ) &&
    (
      text.includes('kg') ||
      text.includes('키로') ||
      text.includes('킬로')
    )
  ) {

    return 12;

  }


  if (
    /15(?:kg|키로|킬로)/i.test(
      text
    ) ||
    text.includes(
      '15'
    ) &&
    (
      text.includes('kg') ||
      text.includes('키로') ||
      text.includes('킬로')
    )
  ) {

    return 15;

  }


  if (
    /20(?:kg|키로|킬로)/i.test(
      text
    ) ||
    text.includes(
      '20'
    ) &&
    (
      text.includes('kg') ||
      text.includes('키로') ||
      text.includes('킬로')
    )
  ) {

    return 20;

  }


  if (
    text.includes('십이') &&
    (
      text.includes('키로') ||
      text.includes('킬로') ||
      text.includes('kg')
    )
  ) {

    return 12;

  }


  if (
    text.includes('십오') &&
    (
      text.includes('키로') ||
      text.includes('킬로') ||
      text.includes('kg')
    )
  ) {

    return 15;

  }


  if (
    text.includes('이십') &&
    (
      text.includes('키로') ||
      text.includes('킬로') ||
      text.includes('kg')
    )
  ) {

    return 20;

  }


  return '';

}

// ==========================================================

async function prepareMicrophone() {

  if (
    microphoneReady
  ) {

    return true;

  }


  if (
    microphonePermissionDenied
  ) {

    alert(
      '마이크 권한이 차단되어 있습니다.\n\n' +
      '휴대폰 브라우저의 사이트 설정에서\n' +
      '마이크 권한을 허용해주세요.'
    );

    return false;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    return true;

  }


  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:
          true
      });


    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    microphoneReady =
      true;


    return true;

  } catch (error) {

    console.log(
      '마이크 권한 확인:',
      error
    );


    if (
      error &&
      (
        error.name ===
        'NotAllowedError' ||
        error.name ===
        'PermissionDeniedError'
      )
    ) {

      microphonePermissionDenied =
        true;


      alert(
        '마이크 권한이 허용되지 않았습니다.\n\n' +
        '휴대폰 브라우저의 사이트 설정에서\n' +
        '마이크 권한을 허용해주세요.'
      );


      return false;

    }


    return true;

  }

}


// ==========================================================
// 🎙️ 음성 인식 시작
// ==========================================================

async function startVoice() {

  if (
    isRecording ||
    recognitionStartPending
  ) {

    return;

  }


  const microphoneOk =
    await prepareMicrophone();


  if (
    !microphoneOk
  ) {

    return;

  }


  if (
    !recognition
  ) {

    if (
      !initRecognition()
    ) {

      return;

    }

  }


  finishRequested =
    false;


  recognitionStartPending =
    true;


  finalTranscript =
    '';

  interimTranscript =
    '';

  displayedTranscript =
    '';


  transactionTime =
    getCurrentTimeLocal();


  document
    .getElementById(
      'recognizedText'
    )
    .textContent =
      '듣고 있습니다...';


  document
    .getElementById(
      'voiceStatus'
    )
    .textContent =
      '주문 내용을 말씀해주세요.';


  document
    .getElementById(
      'startButton'
    )
    .disabled =
      true;


  document
    .getElementById(
      'finishButton'
    )
    .disabled =
      false;


  try {

    recognition.start();

  } catch (e) {

    console.log(
      'recognition.start:',
      e
    );


    recognitionStartPending =
      false;


    isRecording =
      false;

    recognitionRunning =
      false;


    updateVoiceUI();

    return;

  }


  startRecordingTimer();

}


// ==========================================================
// 🎙️ Recognition 초기화
// ==========================================================

function initRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (
    !SpeechRecognition
  ) {

    alert(
      '이 브라우저에서는 음성인식을 사용할 수 없습니다.\n' +
      'Chrome 또는 Edge에서 사용해주세요.'
    );


    return false;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    'ko-KR';


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function() {

      recognitionStartPending =
        false;

      isRecording =
        true;

      recognitionRunning =
        true;

      updateVoiceUI();

    };


  recognition.onresult =
    function(event) {

      let finalText =
        '';

      let interimText =
        '';


      for (
        let i =
          event.resultIndex;

        i <
        event.results.length;

        i++
      ) {

        const transcript =
          event.results[i][0]
            .transcript
            .trim();


        if (
          event.results[i].isFinal
        ) {

          finalText +=
            transcript +
            ' ';

        } else {

          interimText +=
            transcript +
            ' ';

        }

      }


      if (
        finalText
      ) {

        finalTranscript =
          appendWithoutDuplicate(
            finalTranscript,
            finalText
          );

      }


      interimTranscript =
        interimText.trim();


      showCurrentText();

    };


  recognition.onerror =
    function(event) {

      console.log(
        'Speech recognition error:',
        event.error
      );


      if (
        event.error ===
        'not-allowed'
      ) {

        isRecording =
          false;

        recognitionRunning =
          false;

        recognitionStartPending =
          false;


        stopRecordingTimer();


        microphonePermissionDenied =
          true;


        updateVoiceUI();


        alert(
          '마이크 권한이 허용되지 않았습니다.\n' +
          '브라우저의 마이크 권한을 확인해주세요.'
        );


        return;

      }


      if (
        event.error ===
        'aborted'
      ) {

        recognitionStartPending =
          false;

        return;

      }


      if (
        event.error ===
        'no-speech'
      ) {

        document
          .getElementById(
            'voiceStatus'
          )
          .textContent =
            '잠시 기다리고 있습니다. 계속 말씀해주세요.';

      }

    };


  recognition.onend =
    function() {

      recognitionRunning =
        false;


      recognitionStartPending =
        false;


      if (
        isRecording &&
        !finishRequested
      ) {

        clearTimeout(
          recognitionRestartTimer
        );


        recognitionRestartTimer =
          setTimeout(
            function() {

              if (
                !isRecording ||
                finishRequested
              ) {

                return;

              }


              try {

                recognition.start();

              } catch (e) {

                console.log(
                  '자동 재시작:',
                  e
                );


                clearTimeout(
                  recognitionRestartTimer
                );


                recognitionRestartTimer =
                  setTimeout(
                    function() {

                      if (
                        !isRecording ||
                        finishRequested ||
                        recognitionRunning
                      ) {

                        return;

                      }


                      try {

                        recognition.start();

                      } catch (
                        retryError
                      ) {

                        console.log(
                          '자동 재시작 재시도:',
                          retryError
                        );

                      }

                    },
                    500
                  );

              }

            },
            300
          );


        return;

      }


      isRecording =
        false;


      stopRecordingTimer();

      updateVoiceUI();


      if (
        finishRequested &&
        (
          finalTranscript.trim() ||
          displayedTranscript.trim()
        )
      ) {

        finalizeRecording();

      } else {

        finishRequested =
          false;

      }

    };


  return true;

}


// ==========================================================
// 🎙️ 현재 음성 표시
// ==========================================================

function showCurrentText() {

  const finalText =
    finalTranscript.trim();

  const interimText =
    interimTranscript.trim();


  let text =
    finalText;


  if (
    interimText
  ) {

    if (
      text
    ) {

      text +=
        ' ';

    }


    text +=
      interimText;

  }


  if (
    text
  ) {

    displayedTranscript =
      text;


    document
      .getElementById(
        'recognizedText'
      )
      .textContent =
        text;

  }

}


// ==========================================================
// 🔄 중복 문장 방지
// ==========================================================

function appendWithoutDuplicate(
  base,
  addition
) {

  const cleanBase =
    String(
      base || ''
    ).trim();

  const cleanAddition =
    String(
      addition || ''
    ).trim();


  if (
    !cleanAddition
  ) {

    return cleanBase;

  }


  if (
    !cleanBase
  ) {

    return cleanAddition;

  }


  if (
    cleanBase.includes(
      cleanAddition
    )
  ) {

    return cleanBase;

  }


  return (
    cleanBase +
    ' ' +
    cleanAddition
  );

}


// ==========================================================
// ⏱️ 30초 타이머
// ==========================================================

function startRecordingTimer() {

  stopRecordingTimer();


  let seconds =
    30;


  document
    .getElementById(
      'timer'
    )
    .textContent =
      '남은 시간 30초';


  recordingTimer =
    setInterval(
      function() {

        seconds--;


        document
          .getElementById(
            'timer'
          )
          .textContent =
            '남은 시간 ' +
            seconds +
            '초';


        if (
          seconds <=
          0
        ) {

          finishRecording();

        }

      },
      1000
    );

}


// ==========================================================
// ⏹️ 타이머 종료
// ==========================================================

function stopRecordingTimer() {

  if (
    recordingTimer
  ) {

    clearInterval(
      recordingTimer
    );

    recordingTimer =
      null;

  }


  document
    .getElementById(
      'timer'
    )
    .textContent =
      '';

}


// ==========================================================
// 🎙️ 음성 UI
// ==========================================================

function updateVoiceUI() {

  const startButton =
    document.getElementById(
      'startButton'
    );

  const finishButton =
    document.getElementById(
      'finishButton'
    );


  if (
    isRecording ||
    recognitionStartPending
  ) {

    startButton.disabled =
      true;

    finishButton.disabled =
      false;


    startButton
      .querySelector(
        '.main-button-label'
      )

      .getElementById(
        'voiceStatus'
      )
      .textContent =
        '주문 내용을 듣고 있습니다...';

  } else {

    startButton.disabled =
      false;

    finishButton.disabled =
      true;


    startButton
      .querySelector(
        '.main-button-label'
      )
      .textContent =
        '말하기 시작';

  }

}


// ==========================================================
// ⏹️ 말하기 완료
// ==========================================================

function finishRecording() {

  if (
    !isRecording &&
    !recognitionStartPending &&
    !recognition
  ) {

    return;

  }


  finishRequested =
    true;


  isRecording =
    false;


  recognitionStartPending =
    false;


  stopRecordingTimer();


  clearTimeout(
    recognitionRestartTimer
  );


  if (
    recognition &&
    recognitionRunning
  ) {

    try {

      recognition.stop();

    } catch (e) {

      console.log(
        e
      );

    }


    return;

  }


  if (
    finalTranscript.trim() ||
    displayedTranscript.trim()
  ) {

    finalizeRecording();

  } else {

    finishRequested =
      false;

    updateVoiceUI();

    document
      .getElementById(
        'voiceStatus'
      )
      .textContent =
        '음성이 인식되지 않았습니다. 다시 말씀해주세요.';

  }

}


// ==========================================================
// 🧠 최종 음성 처리
// ==========================================================

function finalizeRecording() {

  if (
    isSending
  ) {

    return;

  }


  const text =
    (
      finalTranscript ||
      displayedTranscript ||
      document
        .getElementById(
          'recognizedText'
        )
        .textContent
    )
      .trim();


  if (
    !text ||
    text ===
    '음성 인식 내용이 여기에 표시됩니다.' ||
    text ===
    '듣고 있습니다...'
  ) {

    alert(
      '인식된 주문 내용이 없습니다.\n다시 말씀해주세요.'
    );


    finishRequested =
      false;


    updateVoiceUI();


    return;

  }


  isSending =
    true;


  document
    .getElementById(
      'voiceStatus'
    )
    .textContent =
      '🔎 음성을 분석하고 있어요...';


  showLoading(
    '주문 내용을 분석하고 있어요...'
  );


  setTimeout(
    function() {

      const parsed =
        parseOrderText(
          text
        );


      hideLoading();


      isSending =
        false;


      fillStep2(
        parsed
      );


      showStep2();

    },
    300
  );

}


// ==========================================================
// 🧠 주문 분석
// ==========================================================

function parseOrderText(
  text
) {

  const result = {

    type:
      selectedType,

    partnerId:
      '',

    itemId:
      '',

    quantity:
      1,

    date:
      getTodayLocal(),

    memo:
      '',

    deliveryType:
      ''

  };


  const normalized =
    normalizeSpeechText(
      text
    );


  if (
    /입고|입고해|받아|들어|입고로/i
      .test(
        normalized
      )
  ) {

    result.type =
      'in';

  }


  if (
    /출고|출고해|보내|납품|출하/i
      .test(
        normalized
      )
  ) {

    result.type =
      'out';

  }


  const quantityMatch =
    normalized.match(
      /(\d+)\s*(개|박스|box)?/i
    );


  if (
    quantityMatch
  ) {

    const number =
      Number(
        quantityMatch[1]
      );


    if (
      number > 0
    ) {

      result.quantity =
        number;

    }

  }


  const itemMatch =
    findBestItemFromSpeech(
      normalized
    );


  if (
    itemMatch
  ) {

    result.itemId =
      itemMatch.id;

  }


  const partnerMatch =
    findBestPartnerFromSpeech(
      normalized
    );


  if (
    partnerMatch
  ) {

    result.partnerId =
      partnerMatch.id;

  }


  let deliveryType =
    '';


  if (
    /택배/.test(
      normalized
    )
  ) {

    deliveryType =
      '택배 발송';

  } else if (
    /본사/.test(
      normalized
    )
  ) {

    deliveryType =
      '본사 발송';

  }


  result.deliveryType =
    deliveryType;


  if (
    deliveryType
  ) {

    result.memo =
      deliveryType;

  } else {

    result.memo =
      '';

  }


  return result;

}


// ==========================================================
// 🧹 음성인식 문자열 정규화
// ==========================================================

function normalizeSpeechText(
  text
) {

  return String(
    text || ''
  )
    .toLowerCase()
    .replace(
      /[\s\-_.,/()[\]{}:;!?~'"`]+/g,
      ''
    )
    .trim();

}


// ==========================================================
// 🔤 문자열 유사도
// ==========================================================

function getStringSimilarity(
  a,
  b
) {

  const first =
    normalizeSpeechText(
      a
    );

  const second =
    normalizeSpeechText(
      b
    );


  if (
    !first ||
    !second
  ) {

    return 0;

  }


  if (
    first ===
    second
  ) {

    return 1;

  }


  if (
    first.includes(
      second
    ) ||
    second.includes(
      first
    )
  ) {

    const shorter =
      Math.min(
        first.length,
        second.length
      );

    const longer =
      Math.max(
        first.length,
        second.length
      );


    return (
      shorter /
      longer
    );

  }


  const distance =
    levenshteinDistance(
      first,
      second
    );


  const maxLength =
    Math.max(
      first.length,
      second.length
    );


  if (
    !maxLength
  ) {

    return 0;

  }


  return (
    1 -
    (
      distance /
      maxLength
    )
  );

}


// ==========================================================
// 🔢 편집거리
// ==========================================================

function levenshteinDistance(
  a,
  b
) {

  const first =
    String(
      a || ''
    );

  const second =
    String(
      b || ''
    );


  const matrix =
    [];


  for (
    let i = 0;

    i <= first.length;

    i++
  ) {

    matrix[i] =
      [i];

  }


  for (
    let j = 0;

    j <= second.length;

    j++
  ) {

    matrix[0][j] =
      j;

  }


  for (
    let i = 1;

    i <= first.length;

    i++
  ) {

    for (
      let j = 1;

      j <= second.length;

      j++
    ) {

      const cost =
        first[i - 1] ===
        second[j - 1]
          ? 0
          : 1;


      matrix[i][j] =
        Math.min(

          matrix[i - 1][j] + 1,

          matrix[i][j - 1] + 1,

          matrix[i - 1][j - 1] +
          cost

        );

    }

  }


  return (
    matrix[first.length][second.length]
  );

}


// ==========================================================
// 👥 BoxHero 거래처 음성 매칭
// ==========================================================

function findBestPartnerFromSpeech(
  speechText
) {

  const speech =
    normalizeSpeechText(
      speechText
    );


  if (
    !speech
  ) {

    return null;

  }


  let bestPartner =
    null;

  let bestScore =
    0;


  masterData.partners.forEach(
    function(partner) {

      const name =
        String(
          partner.name || ''
        )
          .trim();


      if (
        !name
      ) {

        return;

      }


      const normalizedName =
        normalizeSpeechText(
          name
        );


      if (
        !normalizedName
      ) {

        return;

      }


      let score =
        0;


      if (
        speech ===
        normalizedName
      ) {

        score =
          1.0;

      }


      else if (
        speech.includes(
          normalizedName
        )
      ) {

        score =
          0.98;

      }


      else if (
        normalizedName.includes(
          speech
        ) &&
        speech.length >= 2
      ) {

        score =
          0.90;

      }


      else {

        score =
          getStringSimilarity(
            speech,
            normalizedName
          );

      }


      if (
        normalizedName.length <= 2 &&
        score < 1
      ) {

        return;

      }


      if (
        score >
        bestScore
      ) {

        bestScore =
          score;

        bestPartner =
          partner;

      }

    }
  );


  if (
    bestScore < 0.72
  ) {

    return null;

  }


  return bestPartner;

}


// ==========================================================
// 📦 BoxHero 상품 음성 매칭
// ==========================================================

function findBestItemFromSpeech(
  speechText
) {

  const speech =
    normalizeSpeechText(
      speechText
    );


  if (
    !speech
  ) {

    return null;

  }


  const items =
    masterData.items.filter(
      function(item) {

        const name =
          String(
            item.name || ''
          );


        return (
          name.includes(
            '푸로찜'
          ) &&
          (
            getProductSize(
              name
            ) === 12 ||
            getProductSize(
              name
            ) === 15 ||
            getProductSize(
              name
            ) === 20
          )
        );

      }
    );


  let requestedSize =
    getSpokenProductSize(
      speech
    );


  let bestItem =
    null;

  let bestScore =
    0;


  items.forEach(
    function(item) {

      const itemName =
        String(
          item.name || ''
        );


      const normalizedItemName =
        normalizeSpeechText(
          itemName
        );


      const itemSize =
        getProductSize(
          itemName
        );


      let score =
        getStringSimilarity(
          speech,
          normalizedItemName
        );


      if (
        requestedSize &&
        itemSize ===
        requestedSize
      ) {

        score +=
          0.35;

      }


      if (
        requestedSize &&
        itemSize &&
        itemSize !==
        requestedSize
      ) {

        score -=
          0.50;

      }


      if (
        score >
        bestScore
      ) {

        bestScore =
          score;

        bestItem =
          item;

      }

    }
  );


  if (
    requestedSize
  ) {

    const sizeItems =
      items.filter(
        function(item) {

          return (
            getProductSize(
              item.name
            ) ===
            requestedSize
          );

        }
      );


    if (
      sizeItems.length === 1
    ) {

      return sizeItems[0];

    }


    if (
      bestItem &&
      getProductSize(
        bestItem.name
      ) ===
      requestedSize
    ) {

      return bestItem;

    }

  }


  if (
    bestItem &&
    bestScore >= 0.55
  ) {

    return bestItem;

  }


  return null;

}


// ==========================================================
// 📏 음성 제품 규격
// ==========================================================

function getSpokenProductSize(
  text
) {

  const normalized =
    normalizeSpeechText(
      text
    );


  if (
    /12(?:kg|키로|킬로)/i.test(
      normalized
    ) ||
    normalized.includes(
      '십이키로'
    ) ||
    normalized.includes(
      '십이킬로'
    )
  ) {

    return 12;

  }


  if (
    /15(?:kg|키로|킬로)/i.test(
      normalized
    ) ||
    normalized.includes(
      '십오키로'
    ) ||
    normalized.includes(
      '십오킬로'
    )
  ) {

    return 15;

  }


  if (
    /20(?:kg|키로|킬로)/i.test(
      normalized
    ) ||
    normalized.includes(
      '이십키로'
    ) ||
    normalized.includes(
      '이십킬로'
    )
  ) {

    return 20;

  }


  return '';

}


// ==========================================================
// 🔎 상품 찾기
// ==========================================================

function findItemByKeyword(
  keyword
) {

  const targetSize =
    Number(
      keyword
    );


  const items =
    masterData.items
      .filter(
        function(item) {

          const size =
            getProductSize(
              item.name
            );


          return (
            size ===
            targetSize
          );

        }
      );


  return (
    items[0] ||
    null
  );

}

// ==========================================================
// 👥 거래처 후보
// ==========================================================

function renderPartnerCandidates(
  keyword
) {

  const container =
    document
      .getElementById(
        'clientCandidates'
      );


  if (
    !container
  ) {

    return;

  }


  const normalized =
    String(
      keyword || ''
    )
      .trim()
      .toLowerCase();


  const partners =
    [...masterData.partners]
      .filter(
        function(partner) {

          if (
            !normalized
          ) {

            return true;

          }


          return String(
            partner.name
          )
            .toLowerCase()
            .includes(
              normalized
            );

        }
      )
      .sort(
        function(a, b) {

          return String(
            a.name
          ).localeCompare(
            String(
              b.name
            ),
            'ko'
          );

        }
      )
      .slice(
        0,
        30
      );


  container.innerHTML =
    '';


  if (
    partners.length === 0
  ) {

    const empty =
      document.createElement(
        'div'
      );


    empty.className =
      'client-candidate';


    empty.textContent =
      '검색되는 거래처가 없습니다.';


    container.appendChild(
      empty
    );


    return;

  }


  partners.forEach(
    function(partner) {

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'client-candidate';


      div.textContent =
        partner.name;


      div.addEventListener(
        'click',
        function() {

          selectPartner(
            partner.id
          );

        }
      );


      container.appendChild(
        div
      );

    }
  );

}

function applyDeliveryTypeToMemo() {

  const deliveryType =
    document
      .getElementById(
        'deliveryTypeSelect'
      )
      .value;


  const memoInput =
    document
      .getElementById(
        'memoInput'
      );


  const currentMemo =
    memoInput
      .value
      .trim();


  const cleanedMemo =
    currentMemo
      .replace(
        /^(택배 발송|본사 발송)\s*(\/\s*)?/,
        ''
      )
      .trim();


  if (
    deliveryType
  ) {

    memoInput.value =
      deliveryType +
      (
        cleanedMemo
          ? ' / ' +
            cleanedMemo
          : ''
      );

  } else {

    memoInput.value =
      cleanedMemo;

  }


  updateSummary();

}

function registerTransaction() {

  const partnerId =
    document
      .getElementById(
        'partnerSelect'
      )
      .value;


  const itemId =
    document
      .getElementById(
        'itemSelect'
      )
      .value;


  const quantity =
    Number(
      document
        .getElementById(
          'quantityInput'
        )
        .value
    );


  const type =
    document
      .getElementById(
        'typeSelect'
      )
      .value;


  const date =
    document
      .getElementById(
        'dateInput'
      )
      .value;


  const deliveryType =
    document
      .getElementById(
        'deliveryTypeSelect'
      )
      .value;


  let memo =
    document
      .getElementById(
        'memoInput'
      )
      .value
      .trim();


  if (
    !partnerId
  ) {

    alert(
      '거래처를 선택해주세요.'
    );

    return;

  }


  if (
    !itemId
  ) {

    alert(
      '제품을 선택해주세요.'
    );

    return;

  }


  if (
    !quantity ||
    quantity <= 0
  ) {

    alert(
      '수량을 확인해주세요.'
    );

    return;

  }


  if (
    !date
  ) {

    alert(
      '날짜를 선택해주세요.'
    );

    return;

  }


  const location =
    masterData.locations[0];


  if (
    !location
  ) {

    alert(
      'BoxHero 위치 정보를 찾을 수 없습니다.'
    );

    return;

  }


  const transactionDateTime =
    combineDateAndTime(
      date
    );


  if (
    deliveryType &&
    !memo
  ) {

    memo =
      deliveryType;

  }


  const finalMemo =
    [
      '푸로찜 에스 음성입출고',

      '날짜=' +
      transactionDateTime,

      memo
        ? '메모=' +
          memo
        : ''

    ]
      .filter(
        function(value) {

          return value !== '';

        }
      )
      .join(
        ' / '
      );


  const registerButton =
    document
      .getElementById(
        'registerButton'
      );


  registerButton.disabled =
    true;


  showLoading(
    'BoxHero에 실제 재고를 등록하고 있습니다...'
  );


  callGas(
    'registerBoxHeroTransaction',
    {

      type:
        type,

      partnerId:
        partnerId,

      itemId:
        itemId,

      locationId:
        location.id,

      quantity:
        quantity,

      transactionDate:
        transactionDateTime,

      memo:
        finalMemo

    }
  )
    .then(
      function(result) {

        hideLoading();

        registerButton.disabled =
          false;

        showResult(
          result
        );

      }
    )
    .catch(
      function(error) {

        hideLoading();

        registerButton.disabled =
          false;

        alert(
          'BoxHero 등록에 실패했습니다.\n\n' +
          getErrorMessage(error)
        );

      }
    );

}

// ⏳ 로딩
// ==========================================================

function showLoading(
  text
) {

  document
    .getElementById(
      'loadingText'
    )
    .textContent =
      text;


  document
    .getElementById(
      'loading'
    )
    .classList
    .remove(
      'hidden'
    );

}


function hideLoading() {

  document
    .getElementById(
      'loading'
    )
    .classList
    .add(
      'hidden'
    );

}


// ==========================================================
// ❗ 오류 메시지
// ==========================================================

function getErrorMessage(
  error
) {

  if (
    !error
  ) {

    return '알 수 없는 오류';

  }


  if (
    typeof error ===
    'string'
  ) {

    return error;

  }


  return (
    error.message ||
    JSON.stringify(
      error
    )
  );

}


// ==========================================================
// 🔐 HTML escape
// ==========================================================

function escapeHtml(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}
