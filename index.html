<!DOCTYPE html>

<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070b"
  >

  <title>
    푸로찜 에스 X BoxHero
  </title>

  <style>

    /* ======================================================
       🎨 기본 색상
       ====================================================== */

    :root {

      --bg:
        #05070b;

      --card:
        rgba(255,255,255,.96);

      --text:
        #111827;

      --muted:
        #6b7280;

      --line:
        #e5e7eb;

      --green:
        #15803d;

      --red:
        #dc2626;

      --dark:
        #111827;

      --gold:
        #c9a227;

    }


    /* ======================================================
       🔧 기본
       ====================================================== */

    * {

      box-sizing:
        border-box;

    }


    html {

      scroll-behavior:
        smooth;

    }


    body {

      margin:
        0;

      padding:
        0 14px 30px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

      color:
        var(--text);

      min-height:
        100vh;

      position:
        relative;

      overflow-x:
        hidden;

      background:
        #05070b;

    }


    body::before {

      content:
        "";

      position:
        fixed;

      inset:
        0;

      background:
        linear-gradient(
          rgba(0,0,0,.56),
          rgba(0,0,0,.70)
        );

      pointer-events:
        none;

      z-index:
        0;

    }


    body::after {

      content:
        "";

      position:
        fixed;

      inset:
        0;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(201,162,39,.18),
          transparent 35%
        );

      pointer-events:
        none;

      z-index:
        0;

    }


    .container {

      max-width:
        560px;

      margin:
        0 auto;

      position:
        relative;

      z-index:
        1;

    }


    .screen {

      width:
        100%;

    }


    .step-hidden {

      display:
        none !important;

    }


    /* ======================================================
       🏆 HERO
       ====================================================== */

    .hero {

      height:
        285px;

      border-radius:
        0 0 30px 30px;

      overflow:
        hidden;

      position:
        relative;

      display:
        flex;

      align-items:
        flex-end;

      justify-content:
        center;

      margin:
        0 -14px 18px;

      background:
        linear-gradient(
          180deg,
          #111827 0%,
          #05070b 100%
        );

    }


    .hero::before {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(201,162,39,.24),
          transparent 40%
        );

    }


    .hero::after {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      background:
        linear-gradient(
          transparent 35%,
          rgba(5,7,11,.92) 100%
        );

    }


    .hero-content {

      position:
        relative;

      z-index:
        2;

      width:
        100%;

      text-align:
        center;

      padding:
        0 20px 27px;

    }


    .hero-kicker {

      font-size:
        11px;

      font-weight:
        900;

      letter-spacing:
        2px;

      color:
        #d7bd61;

      margin-bottom:
        7px;

    }


    .hero-symbol {

      font-size:
        18px;

      color:
        var(--gold);

      margin:
        0 0 5px;

    }


    .hero-title {

      font-size:
        28px;

      line-height:
        1.15;

      font-weight:
        950;

      letter-spacing:
        -1.2px;

      color:
        white;

      text-shadow:
        0 3px 15px rgba(0,0,0,.45);

    }


    .hero-sub {

      margin-top:
        10px;

      font-size:
        11px;

      color:
        rgba(255,255,255,.72);

      letter-spacing:
        .5px;

    }


    /* ======================================================
       🔢 STEP INDICATOR
       ====================================================== */

    .step-indicator {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        8px;

      margin:
        0 0 15px;

    }


    .step-dot {

      width:
        9px;

      height:
        9px;

      border-radius:
        50%;

      background:
        #d1d5db;

    }


    .step-dot.active {

      width:
        11px;

      height:
        11px;

      background:
        var(--gold);

      box-shadow:
        0 0 0 4px rgba(201,162,39,.13);

    }


    .step-line {

      width:
        38px;

      height:
        1px;

      background:
        #d1d5db;

    }


    /* ======================================================
       🃏 CARD
       ====================================================== */

    .card {

      background:
        var(--card);

      border:
        1px solid
        rgba(255,255,255,.72);

      border-radius:
        22px;

      padding:
        21px;

      margin-bottom:
        16px;

      box-shadow:
        0 18px 50px
        rgba(0,0,0,.18);

      backdrop-filter:
        blur(12px);

    }


    .card-title {

      font-size:
        19px;

      font-weight:
        900;

      margin-bottom:
        17px;

      letter-spacing:
        -.5px;

    }


    .card-subtitle {

      color:
        var(--muted);

      font-size:
        13px;

      margin:
        -8px 0 17px;

      line-height:
        1.5;

    }


    /* ======================================================
       📥📤 입출고 선택
       ====================================================== */

    .mode-buttons {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        10px;

      margin-bottom:
        17px;

    }


    .mode-button {

      border:
        1px solid
        transparent;

      border-radius:
        16px;

      padding:
        15px 10px;

      font-size:
        16px;

      font-weight:
        900;

      cursor:
        pointer;

      transition:
        .18s;

    }


    .mode-button.in {

      background:
        #ecfdf3;

      color:
        var(--green);

    }


    .mode-button.out {

      background:
        #fff1f2;

      color:
        var(--red);

    }


    .mode-button.active {

      box-shadow:
        0 0 0 3px
        currentColor;

    }


    /* ======================================================
       🎙️ 음성 영역
       ====================================================== */

    .voice-area {

      text-align:
        center;

      padding:
        8px 4px 5px;

    }


    .main-buttons {

      display:
        flex;

      justify-content:
        center;

      gap:
        10px;

    }


    .main-button {

      width:
        170px;

      height:
        56px;

      border:
        1px solid
        rgba(201,162,39,.75);

      border-radius:
        17px;

      color:
        white;

      background:
        linear-gradient(
          135deg,
          #111827,
          #252c3a
        );

      font-size:
        15px;

      font-weight:
        900;

      cursor:
        pointer;

      box-shadow:
        0 9px 25px
        rgba(0,0,0,.20);

      transition:
        .18s;

    }


    .main-button:hover {

      transform:
        translateY(-1px);

    }


    .main-button:disabled {

      opacity:
        .48;

      cursor:
        not-allowed;

      transform:
        none;

    }


    .main-button.finish {

      background:
        linear-gradient(
          135deg,
          #c9a227,
          #a88414
        );

      color:
        #111827;

    }


    .main-button-label {

      display:
        inline-block;

      margin-left:
        4px;

    }


    .voice-status {

      margin-top:
        13px;

      font-size:
        13px;

      color:
        var(--muted);

      min-height:
        20px;

    }


    .timer {

      margin-top:
        4px;

      font-size:
        12px;

      color:
        var(--muted);

      min-height:
        17px;

    }


    .recognized-text {

      margin-top:
        13px;

      padding:
        13px;

      background:
        #f8fafc;

      border:
        1px solid
        #e5e7eb;

      border-radius:
        14px;

      font-size:
        14px;

      line-height:
        1.65;

      text-align:
        left;

      min-height:
        51px;

      white-space:
        pre-wrap;

      word-break:
        break-word;

    }


    /* ======================================================
       ✏️ 직접 입력 버튼
       ====================================================== */

    .direct-button {

      width:
        100%;

      margin-top:
        12px;

      border:
        1px solid
        #d9dde5;

      border-radius:
        15px;

      padding:
        14px;

      background:
        white;

      color:
        #374151;

      font-size:
        15px;

      font-weight:
        800;

      cursor:
        pointer;

    }


    /* ======================================================
       📝 STEP 2 HEADER
       ====================================================== */

    .preview-header {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        7px;

      margin-bottom:
        14px;

    }


    .preview-actions {

      display:
        flex;

      align-items:
        center;

      gap:
        5px;

      width:
        100%;

    }


    .preview-action-button {

      flex:
        1;

      min-width:
        0;

      border:
        1px solid
        #e1e4e9;

      border-radius:
        11px;

      padding:
        9px 7px;

      background:
        white;

      color:
        #374151;

      font-size:
        12px;

      font-weight:
        800;

      white-space:
        nowrap;

      cursor:
        pointer;

    }


    .preview-step-label {

      flex:
        0 0 auto;

      color:
        #9ca3af;

      font-size:
        11px;

      font-weight:
        900;

      padding-left:
        2px;

    }


    /* ======================================================
       🏢 거래처 검색
       ====================================================== */

    .client-search-wrap {

      position:
        relative;

    }


    .client-search-buttons {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        7px;

      margin-bottom:
        8px;

    }


    .client-search-button {

      border:
        1px solid
        #dfe3e8;

      border-radius:
        12px;

      padding:
        11px 8px;

      background:
        white;

      color:
        #374151;

      font-size:
        13px;

      font-weight:
        800;

      cursor:
        pointer;

    }


    .client-search-button.active {

      border-color:
        var(--gold);

      background:
        #fffdf4;

      box-shadow:
        0 0 0 3px
        rgba(201,162,39,.10);

    }


    .client-search-row {

      display:
        grid;

      grid-template-columns:
        1fr;

      gap:
        8px;

    }


    .client-search {

      position:
        relative;

    }


    .client-search-icon {

      position:
        absolute;

      left:
        13px;

      top:
        50%;

      transform:
        translateY(-50%);

      font-size:
        15px;

      z-index:
        1;

    }


    .client-search input {

      padding-left:
        39px;

    }


    .client-candidates {

      margin-top:
        7px;

      max-height:
        180px;

      overflow-y:
        auto;

      border-radius:
        13px;

    }


    .client-candidate {

      padding:
        11px 13px;

      border:
        1px solid
        #e5e7eb;

      border-bottom:
        none;

      background:
        white;

      cursor:
        pointer;

      font-size:
        14px;

    }


    .client-candidate:last-child {

      border-bottom:
        1px solid
        #e5e7eb;

    }


    .client-candidate:hover {

      background:
        #f8fafc;

    }


    .selected-client {

      margin-top:
        8px;

      padding:
        11px 13px;

      background:
        #ecfdf3;

      border:
        1px solid
        #bbf7d0;

      color:
        #166534;

      border-radius:
        12px;

      font-size:
        13px;

      font-weight:
        800;

    }


    /* ======================================================
       🏷️ FIELD
       ====================================================== */

    .field {

      margin-bottom:
        16px;

    }


    .field:last-child {

      margin-bottom:
        0;

    }


    .field-label {

      display:
        block;

      font-size:
        13px;

      font-weight:
        900;

      margin-bottom:
        7px;

      color:
        #4b5563;

    }


    select,
    input,
    textarea {

      width:
        100%;

      border:
        1px solid
        #dfe3e8;

      border-radius:
        14px;

      padding:
        13px;

      font-size:
        17px;

      background:
        white;

      color:
        #111827;

      outline:
        none;

    }


    select:focus,
    input:focus,
    textarea:focus {

      border-color:
        var(--gold);

      box-shadow:
        0 0 0 3px
        rgba(201,162,39,.12);

    }


    input[type="date"] {

      min-height:
        49px;

    }


    textarea {

      min-height:
        85px;

      resize:
        vertical;

      line-height:
        1.55;

    }


    .product-help {

      margin-top:
        7px;

      color:
        #9ca3af;

      font-size:
        11px;

    }


    /* ======================================================
       📊 SUMMARY
       ====================================================== */

    .summary {

      background:
        #f8fafc;

      border:
        1px solid
        #e5e7eb;

      border-radius:
        16px;

      padding:
        15px;

      margin-top:
        17px;

      line-height:
        1.85;

      font-size:
        14px;

    }


    .summary strong {

      font-weight:
        900;

    }


    /* ======================================================
       🚀 BUTTON
       ====================================================== */

    .primary-button {

      width:
        100%;

      border:
        1px solid
        rgba(201,162,39,.75);

      border-radius:
        16px;

      padding:
        16px;

      background:
        linear-gradient(
          135deg,
          #111827,
          #252c3a
        );

      color:
        white;

      font-size:
        16px;

      font-weight:
        900;

      cursor:
        pointer;

      margin-top:
        17px;

      box-shadow:
        0 10px 25px
        rgba(0,0,0,.15);

    }


    .primary-button:disabled {

      opacity:
        .45;

      cursor:
        not-allowed;

    }


    .secondary-button {

      width:
        100%;

      border:
        1px solid
        #d8dce3;

      border-radius:
        15px;

      padding:
        14px;

      background:
        white;

      color:
        #374151;

      font-size:
        15px;

      font-weight:
        800;

      cursor:
        pointer;

      margin-top:
        10px;

    }


    /* ======================================================
       ⏳ LOADING
       ====================================================== */

    .loading {

      text-align:
        center;

      padding:
        30px 10px;

      color:
        var(--muted);

    }


    .spinner {

      width:
        36px;

      height:
        36px;

      border:
        4px solid
        #e5e7eb;

      border-top-color:
        var(--gold);

      border-radius:
        50%;

      animation:
        spin .8s
        linear infinite;

      margin:
        0 auto 13px;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* ======================================================
       🎉 RESULT
       ====================================================== */

    .result {

      text-align:
        center;

      padding:
        20px 7px 7px;

    }


    .result-icon {

      font-size:
        58px;

      margin-bottom:
        10px;

    }


    .result-title {

      font-size:
        24px;

      font-weight:
        950;

    }


    .result-text {

      margin-top:
        12px;

      color:
        #6b7280;

      line-height:
        1.85;

      font-size:
        14px;

    }


    .hidden {

      display:
        none !important;

    }


    /* ======================================================
       📱 모바일
       ====================================================== */

    @media (
      max-width: 500px
    ) {

      body {

        padding:
          0 10px 25px;

      }


      .container {

        max-width:
          100%;

      }


      .hero {

        margin:
          0 -10px 16px;

        height:
          270px;

        border-radius:
          0 0 27px 27px;

      }


      .hero-title {

        font-size:
          25px;

      }


      .hero-sub {

        font-size:
          10px;

      }


      .card {

        padding:
          17px;

        border-radius:
          19px;

      }


      .main-buttons {

        gap:
          7px;

      }


      .main-button {

        width:
          50%;

        height:
          54px;

        font-size:
          14px;

      }


      .preview-actions {

        gap:
          4px;

      }


      .preview-action-button {

        padding:
          9px 5px;

        font-size:
          12px;

      }


      .preview-step-label {

        display:
          none;

      }

    }


    @media (
      max-width: 420px
    ) {

      .preview-action-button {

        font-size:
          13px;

        padding:
          8px 4px;

      }


      select,
      input,
      textarea {

        font-size:
          16px;

      }

    }

  </style>

</head>

<body>

<div class="container">

  <!-- =====================================================
       🏆 HERO
       ====================================================== -->

  <div class="hero">

    <div class="hero-content">

      <div class="hero-kicker">
        BOXHERO INVENTORY
      </div>

      <div class="hero-symbol">
        ♛
      </div>

      <div class="hero-title">

        푸로찜 에스<br>
        입출고 시스템

      </div>

      <div class="hero-sub">

        김경우 ♡ 박희수 ♡ 김준모 ♡ 김준석

      </div>

    </div>

  </div>


  <!-- =====================================================
       STEP 1
       ====================================================== -->

  <div
    id="step1"
    class="screen"
  >

    <div class="step-indicator">

      <div class="step-dot active"></div>

      <div class="step-line"></div>

      <div class="step-dot"></div>

      <div class="step-line"></div>

      <div class="step-dot"></div>

    </div>


    <div class="card">

      <div class="card-title">

        📦 주문을 입력해주세요

      </div>

      <div class="card-subtitle">

        음성으로 말하거나 직접 입력할 수 있습니다.

      </div>


      <div class="mode-buttons">

        <button
          id="inButton"
          class="mode-button in active"
          onclick="setType('in')"
        >
          📥 입고
        </button>

        <button
          id="outButton"
          class="mode-button out"
          onclick="setType('out')"
        >
          📤 출고
        </button>

      </div>


      <div class="voice-area">

        <div class="main-buttons">

          <button
            id="startButton"
            class="main-button"
            onclick="startVoice()"
          >

            🎙️
            <span class="main-button-label">
              말하기 시작
            </span>

          </button>


          <button
            id="finishButton"
            class="main-button finish"
            onclick="finishRecording()"
            disabled
          >

            ⏹️
            <span class="main-button-label">
              말하기 완료
            </span>

          </button>

        </div>


        <div
          id="voiceStatus"
          class="voice-status"
        >

          버튼을 누르고 주문 내용을 말씀해주세요.

        </div>


        <div
          id="timer"
          class="timer"
        ></div>


        <div
          id="recognizedText"
          class="recognized-text"
        >

          음성 인식 내용이 여기에 표시됩니다.

        </div>

      </div>


      <button
        id="directButton"
        class="direct-button"
        onclick="showDirectInput()"
      >

        ✏️ 직접 입력하기

      </button>

    </div>


    <div
      id="directInputCard"
      class="card hidden"
    >

      <div class="card-title">

        ✏️ 직접 주문 입력

      </div>


      <div class="field">

        <label class="field-label">
          거래처
        </label>

        <select
          id="directPartner"
        ></select>

      </div>


      <div class="field">

        <label class="field-label">
          제품
        </label>

        <select
          id="directItem"
        ></select>

        <div class="product-help">
          푸로찜 15 KG → 20 KG → 12 KG
        </div>

      </div>


      <div class="field">

        <label class="field-label">
          수량
        </label>

        <input
          id="directQuantity"
          type="number"
          min="1"
          value="1"
        >

      </div>


      <div class="field">

        <label class="field-label">
          날짜
        </label>

        <input
          id="directDate"
          type="date"
        >

      </div>


      <div class="field">

        <label class="field-label">
          메모
        </label>

        <textarea
          id="directMemo"
          placeholder="필요하면 메모를 입력하세요."
        ></textarea>

      </div>


      <button
        class="primary-button"
        onclick="directInputAnalyze()"
      >

        🔎 분석하고 확인하기

      </button>

    </div>

  </div>


  <!-- =====================================================
       STEP 2
       ====================================================== -->

  <div
    id="step2"
    class="screen hidden"
  >

    <div class="step-indicator">

      <div class="step-dot"></div>

      <div class="step-line"></div>

<script>


// ==========================================================
// 🌐 GitHub Pages → GAS Web App
// ==========================================================

const GAS_WEB_APP_URL =
  'https://script.google.com/macros/s/AKfycbzZX1JoVHJ07jFBKY6qH0UNcXHIulQuha6t7JnYfUymh8UKkwfpV0miwsAY_ud4WKvc/exec';


// ==========================================================
// 📡 GAS Web App 호출
// ==========================================================

async function callGas(
  action,
  data
) {

  if (
    !GAS_WEB_APP_URL ||
    GAS_WEB_APP_URL.includes(
      '여기에_실제_GAS'
    )
  ) {

    throw new Error(
      'GAS_WEB_APP_URL이 아직 설정되지 않았습니다.'
    );

  }


  const response =
    await fetch(
      GAS_WEB_APP_URL,
      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify({

            action:
              action,

            data:
              data || {}

          })

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      'GAS Web App HTTP 오류: ' +
      response.status
    );

  }


  const result =
    await response.json();


  if (
    result &&
    result.ok === false
  ) {

    throw new Error(
      result.message ||
      'GAS Web App에서 오류가 발생했습니다.'
    );

  }


  return (
    result &&
    Object.prototype.hasOwnProperty.call(
      result,
      'data'
    )
      ? result.data
      : result
  );

}


// ==========================================================
// 📦 전역 상태
// ==========================================================

let masterData = {

  partners: [],

  items: [],

  locations: []

};


let selectedType =
  'in';


let recognition =
  null;


let isRecording =
  false;


let finishRequested =
  false;


let recognitionRunning =
  false;


let recognitionStartPending =
  false;


let finalTranscript =
  '';


let interimTranscript =
  '';


let displayedTranscript =
  '';


let recordingTimer =
  null;


let recognitionRestartTimer =
  null;


let isSending =
  false;


let transactionTime =
  '';


/*
 * ==========================================================
 * 🎙️ 마이크 권한 상태
 *
 * GitHub Pages의 새로운 origin에서
 * 음성인식을 시작할 때 브라우저가 반복적으로
 * 마이크 접근을 요청하는 문제를 줄이기 위해
 * 실제 마이크 권한을 먼저 확인합니다.
 * ==========================================================
 */

let microphoneReady =
  false;


let microphonePermissionDenied =
  false;


// ==========================================================
// 📅 오늘 날짜
// ==========================================================

function getTodayLocal() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      '0'
    );

  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      '0'
    );

  return (
    year +
    '-' +
    month +
    '-' +
    day
  );

}


// ==========================================================
// ⏰ 현재 시간
// ==========================================================

function getCurrentTimeLocal() {

  const now =
    new Date();

  const hours =
    String(
      now.getHours()
    ).padStart(
      2,
      '0'
    );

  const minutes =
    String(
      now.getMinutes()
    ).padStart(
      2,
      '0'
    );

  const seconds =
    String(
      now.getSeconds()
    ).padStart(
      2,
      '0'
    );

  return (
    hours +
    ':' +
    minutes +
    ':' +
    seconds
  );

}


// ==========================================================
// 📅 날짜 + 시간 만들기
// ==========================================================

function combineDateAndTime(
  date
) {

  const selectedDate =
    String(
      date ||
      getTodayLocal()
    ).trim();


  const time =
    transactionTime ||
    getCurrentTimeLocal();


  return (
    selectedDate +
    ' ' +
    time
  );

}


// ==========================================================
// 🚀 초기화
// ==========================================================

window.addEventListener(
  'load',
  function() {

      .getElementById(
        'directDate'

      )

);


// ==========================================================
// 📚 BoxHero 마스터 데이터
// ==========================================================

function loadMasterData() {

  showLoading(

    .catch(

        alert(

}


// ==========================================================
// 🔄 STEP 2 새로고침
//
// 기존 입력값은 최대한 보존합니다.
// ==========================================================

function refreshMasterData() {

  const oldPartner =
    document
      .getElementById(

      )

        'itemSelect'

      .getElementById(

      )
      .value;

    document
      .getElementById(
        'dateInput'
      )

    document
      .getElementById(

      )

          .getElementById(

          )

        document
          .getElementById(
            'itemSelect'

        document
          .getElementById(
            'quantityInput'

          .value =
            oldQuantity;


        document
          .getElementById(

          )
          .value =
            oldType;


        document
          .getElementById(
            'dateInput'
          )
          .value =

        document
          .getElementById(
            'memoInput'
          )
          .value =

        document
          .getElementById(
            'deliveryTypeSelect'
          )
          .value =
            oldDeliveryType;


        selectedType =
          oldType;


        setType(
          oldType
        );


        updateSelectedClient();

        updatePartnerSearchText();

        hideLoading();

      }
    )
    .catch(
      function(error) {

        hideLoading();

        alert(
          '새로고침에 실패했습니다.\n\n' +
          getErrorMessage(error)
        );

      }
    );

}


// ==========================================================
// 👥 거래처 SELECT
// ==========================================================

function populatePartnerSelects() {

  const selects = [

    document.getElementById(
      'partnerSelect'
    ),

    document.getElementById(
      'directPartner'
    )

  ];


  selects.forEach(
    function(select) {

      if (!select) {

        return;

      }


      select.innerHTML =
        '<option value="">거래처를 선택하세요</option>';


      const partners =
        [...masterData.partners]
          .sort(
            function(a, b) {

              return String(
                a.name
              ).localeCompare(
                String(
                  b.name
                ),
                'ko'
              );

            }
          );


      partners.forEach(
        function(partner) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            partner.id;


          option.textContent =
            partner.name;


          select.appendChild(
            option
          );

        }
      );

    }
  );

}


// ==========================================================
// 📦 상품 SELECT
// ==========================================================

function populateItemSelects() {

  const selects = [

    document.getElementById(
      'itemSelect'
    ),

    document.getElementById(
      'directItem'
    )

  ];


  selects.forEach(
    function(select) {

      if (!select) {

        return;

      }


      select.innerHTML =
        '<option value="">제품을 선택하세요</option>';


      /*
       * BoxHero에서 실제 받아온 상품 중
       * 푸로찜 상품을 규격 기준으로 정렬합니다.
       *
       * 기존처럼 이름에 "푸로찜"이 포함된 상품만
       * 화면에 표시하되,
       * 12/15/20 KG 규격 인식을 조금 더 유연하게 합니다.
       */

      const items =
        [...masterData.items]
          .filter(
            function(item) {

              const name =
                String(
                  item.name || ''
                );

              return (
                name.includes(
                  '푸로찜'
                ) &&
                (
                  getProductSize(
                    name
                  ) === 12 ||
                  getProductSize(
                    name
                  ) === 15 ||
                  getProductSize(
                    name
                  ) === 20
                )
              );

            }
          )
          .sort(
            function(a, b) {

              const aSize =
                getProductSize(
                  a.name
                );

              const bSize =
                getProductSize(
                  b.name
                );


              const order = {

                15: 1,

                20: 2,

                12: 3

              };


              const aOrder =
                order[aSize] || 99;

              const bOrder =
                order[bSize] || 99;


              if (
                aOrder !==
                bOrder
              ) {

                return (
                  aOrder -
                  bOrder
                );

              }


              return String(
                a.name
              ).localeCompare(
                String(
                  b.name
                ),
                'ko'
              );

            }
          );


      items.forEach(
        function(item) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            item.id;


          option.textContent =
            item.name;


          select.appendChild(
            option
          );

        }
      );

    }
  );

}


// ==========================================================
// 📏 제품 규격
// ==========================================================

function getProductSize(
  productName
) {

  const text =
    String(
      productName || ''
    )
      .replace(
        /\s+/g,
        ' '
      );


  if (
    /12\s*(kg|키로|킬로)/i.test(
      text
    )
  ) {

    return 12;

  }


  if (
    /15\s*(kg|키로|킬로)/i.test(
      text
    )
  ) {

    return 15;

  }


  if (
    /20\s*(kg|키로|킬로)/i.test(
      text
    )
  ) {

    return 20;

  }


  return '';

}


// ==========================================================
// 📥📤 거래 유형
// ==========================================================

function setType(

) {

  selectedType =
    type;


  const inButton =
    document.getElementById(
      'inButton'
    );

  const outButton =
    document.getElementById(
      'outButton'
    );

    inButton

      );

  if (outButton) {

        type === 'out'
      );

  }


  const typeSelect =

}


// ==========================================================
// 🎙️ 마이크 권한 준비
//
// 최초 한 번 실제 마이크 권한을 확인합니다.
//
// 중요:
// 브라우저 최초 권한 요청 자체는 브라우저 정책상
// 완전히 제거할 수 없습니다.
//
// 권한이 허용된 뒤에는 microphoneReady=true로 유지합니다.
// ==========================================================

async function prepareMicrophone() {

  if (
    microphoneReady
  ) {

    return true;

  }


  if (
    microphonePermissionDenied
  ) {

    alert(
      '마이크 권한이 차단되어 있습니다.\n\n' +
      '휴대폰 브라우저의 사이트 설정에서\n' +
      '마이크 권한을 허용해주세요.'
    );

    return false;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    /*
     * 일부 브라우저에서는 getUserMedia가 없을 수 있습니다.
     * 이 경우 기존 SpeechRecognition으로 계속 시도합니다.
     */

    return true;

  }


  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:
          true
      });


    /*
     * 권한 확인만 하고 실제 녹음은
     * SpeechRecognition이 담당합니다.
     */

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    microphoneReady =
      true;


    return true;

  } catch (error) {

    console.log(
      '마이크 권한 확인:',
      error
    );


    if (
      error &&
      (
        error.name ===
        'NotAllowedError' ||
        error.name ===
        'PermissionDeniedError'
      )
    ) {

      microphonePermissionDenied =
        true;


      alert(
        '마이크 권한이 허용되지 않았습니다.\n\n' +
        '휴대폰 브라우저의 사이트 설정에서\n' +
        '마이크 권한을 허용해주세요.'
      );


      return false;

    }


    /*
     * 기타 오류는 SpeechRecognition 자체에서
     * 다시 처리할 수 있도록 진행합니다.
     */

    return true;

  }

}


// ==========================================================
// 🎙️ 음성 인식 시작
// ==========================================================

async function startVoice() {

  if (
    isRecording ||
    recognitionStartPending
  ) {

    return;

  }


  /*
   * --------------------------------------------------------
   * 📱 휴대폰 마이크 권한 확인
   * --------------------------------------------------------
   */

  const microphoneOk =
    await prepareMicrophone();


  if (
    !microphoneOk
  ) {

    return;

  }


  if (
    !recognition
  ) {

    if (
      !initRecognition()
    ) {

      return;

    }

  }


  finishRequested =
    false;


  recognitionStartPending =
    true;


  finalTranscript =
    '';

  interimTranscript =
    '';

  displayedTranscript =
    '';


  transactionTime =
    getCurrentTimeLocal();


  document
    .getElementById(
      'recognizedText'
    )
    .textContent =
      '듣고 있습니다...';


  document
    .getElementById(
      'voiceStatus'
    )
    .textContent =
      '주문 내용을 말씀해주세요.';


  document
    .getElementById(
      'startButton'
    )
    .disabled =
      true;


  document
    .getElementById(
      'finishButton'
    )
    .disabled =
      false;


  try {

    recognition.start();

  } catch (e) {

    console.log(
      'recognition.start:',
      e
    );


    recognitionStartPending =
      false;


    isRecording =
      false;

    recognitionRunning =
      false;


    updateVoiceUI();

    return;

  }


  startRecordingTimer();

}


// ==========================================================
// 🎙️ Recognition 초기화
// ==========================================================

function initRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (
    !SpeechRecognition
  ) {

    alert(
      '이 브라우저에서는 음성인식을 사용할 수 없습니다.\n' +
      'Chrome 또는 Edge에서 사용해주세요.'
    );


    return false;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    'ko-KR';


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function() {

      recognitionStartPending =
        false;

      isRecording =
        true;

      recognitionRunning =
        true;

      updateVoiceUI();

    };


  recognition.onresult =
    function(event) {

      let finalText =
        '';

      let interimText =
        '';


      for (
        let i =
          event.resultIndex;

        i <
        event.results.length;

        i++
      ) {

        const transcript =
          event.results[i][0]
            .transcript
            .trim();


        if (
          event.results[i].isFinal
        ) {

          finalText +=
            transcript +
            ' ';

        } else {

          interimText +=
            transcript +
            ' ';

        }

      }


      if (
        finalText
      ) {

        finalTranscript =
          appendWithoutDuplicate(
            finalTranscript,
            finalText
          );

      }


      interimTranscript =
        interimText.trim();


      showCurrentText();

    };


  recognition.onerror =
    function(event) {

      console.log(
        'Speech recognition error:',
        event.error
      );


      if (
        event.error ===
        'not-allowed'
      ) {

        isRecording =
          false;

        recognitionRunning =
          false;

        recognitionStartPending =
          false;


        stopRecordingTimer();


        /*
         * 권한이 차단된 상태에서는 계속 재시작해서
         * 같은 권한 메시지를 반복하지 않습니다.
         */

        microphonePermissionDenied =
          true;


        updateVoiceUI();


        alert(
          '마이크 권한이 허용되지 않았습니다.\n' +
          '브라우저의 마이크 권한을 확인해주세요.'
        );


        return;

      }


      if (
        event.error ===
        'aborted'
      ) {

        recognitionStartPending =
          false;

        return;

      }


      if (
        event.error ===
        'no-speech'
      ) {

        /*
         * 중요:
         * no-speech라고 해서 녹음을 끝내지 않습니다.
         *
         * onend에서 자동 재시작되므로
         * 사용자가 잠깐 말을 멈춰도 계속 듣습니다.
         */

        document
          .getElementById(
            'voiceStatus'
          )
          .textContent =
            '잠시 기다리고 있습니다. 계속 말씀해주세요.';

      }

    };


  recognition.onend =
    function() {

      recognitionRunning =
        false;


      recognitionStartPending =
        false;


      /*
       * ------------------------------------------------------
       * ⭐ 핵심
       *
       * 음성이 잠깐 끊겼거나 공백이 생겨도
       * finishRequested가 아니면 계속 이어갑니다.
       * ------------------------------------------------------
       */

      if (
        isRecording &&
        !finishRequested
      ) {

        clearTimeout(
          recognitionRestartTimer
        );


        recognitionRestartTimer =
          setTimeout(
            function() {

              if (
                !isRecording ||
                finishRequested
              ) {

                return;

              }


              try {

                recognition.start();

              } catch (e) {

                console.log(
                  '자동 재시작:',
                  e
                );

                /*
                 * 이미 시작된 상태 등의 이유로 실패한 경우
                 * 짧게 한 번 더 시도합니다.
                 */

                clearTimeout(
                  recognitionRestartTimer
                );


                recognitionRestartTimer =
                  setTimeout(
                    function() {

                      if (
                        !isRecording ||
                        finishRequested ||
                        recognitionRunning
                      ) {

                        return;

                      }


                      try {

                        recognition.start();

                      } catch (
                        retryError
                      ) {

                        console.log(
                          '자동 재시작 재시도:',
                          retryError
                        );

                      }

                    },
                    500
                  );

              }

            },
            300
          );


        return;

      }


      isRecording =
        false;


      stopRecordingTimer();

      updateVoiceUI();


      if (
        finishRequested &&
        (
          finalTranscript.trim() ||
          displayedTranscript.trim()
        )
      ) {

        finalizeRecording();

      } else {

        finishRequested =
          false;

      }

    };


  return true;

}


// ==========================================================
// 🎙️ 현재 음성 표시
// ==========================================================

function showCurrentText() {

  const finalText =
    finalTranscript.trim();

  const interimText =
    interimTranscript.trim();


  let text =
    finalText;


  if (
    interimText
  ) {

    if (
      text
    ) {

      text +=
        ' ';

    }


    text +=
      interimText;

  }


  if (
    text
  ) {

    displayedTranscript =
      text;


    document
      .getElementById(
        'recognizedText'
      )
      .textContent =
        text;

  }

}


// ==========================================================
// 🔄 중복 문장 방지
// ==========================================================

function appendWithoutDuplicate(
  base,
  addition
) {

  const cleanBase =
    String(
      base || ''
    ).trim();

  const cleanAddition =
    String(
      addition || ''
    ).trim();


  if (
    !cleanAddition
  ) {

    return cleanBase;

  }


  if (
    !cleanBase
  ) {

    return cleanAddition;

  }


  if (
    cleanBase.includes(
      cleanAddition
    )
  ) {

    return cleanBase;

  }


  return (
    cleanBase +
    ' ' +
    cleanAddition
  );

}


// ==========================================================
// ⏱️ 30초 타이머
// ==========================================================

function startRecordingTimer() {

  stopRecordingTimer();


  let seconds =
    30;


  document
    .getElementById(
      'timer'
    )
    .textContent =
      '남은 시간 30초';


  recordingTimer =
    setInterval(
      function() {

        seconds--;


        document
          .getElementById(
            'timer'
          )
          .textContent =
            '남은 시간 ' +
            seconds +
            '초';


        if (
          seconds <=
          0
        ) {

          finishRecording();

        }

      },
      1000
    );

}


// ==========================================================
// ⏹️ 타이머 종료
// ==========================================================

function stopRecordingTimer() {

  if (
    recordingTimer
  ) {

    clearInterval(
      recordingTimer
    );

    recordingTimer =
      null;

  }


  document
    .getElementById(
      'timer'
    )
    .textContent =
      '';

}

// 🎙️ 음성 UI
// ==========================================================

function updateVoiceUI() {

  const startButton =
    document.getElementById(

    );

  const finishButton =
    document.getElementById(
      'finishButton'
    );


  if (
    isRecording ||

  ) {

    startButton.disabled =

    finishButton.disabled =

      )

      .getElementById(

      )
      .textContent =

  } else {

    startButton.disabled =

    finishButton.disabled =

      .querySelector(
        '.main-button-label'
      )
      .textContent =
        '말하기 시작';

  }

}


// ==========================================================
// ⏹️ 말하기 완료
// ==========================================================

function finishRecording() {

  if (
    !isRecording &&
    !recognitionStartPending &&
    !recognition
  ) {

    return;

  }


  finishRequested =
    true;


  isRecording =
    false;


  recognitionStartPending =
    false;


  stopRecordingTimer();


  clearTimeout(
    recognitionRestartTimer
  );


  if (
    recognition &&
    recognitionRunning
  ) {

    try {

      recognition.stop();

    } catch (e) {

      console.log(
        e
      );

    }


    return;

  }


  if (
    finalTranscript.trim() ||
    displayedTranscript.trim()
  ) {

    finalizeRecording();

  } else {

    finishRequested =
      false;

    updateVoiceUI();

    document
      .getElementById(
        'voiceStatus'
      )
      .textContent =
        '음성이 인식되지 않았습니다. 다시 말씀해주세요.';

  }

}


// ==========================================================
// 🧠 최종 음성 처리
// ==========================================================

function finalizeRecording() {

  if (
    isSending
  ) {

    return;

  }


  const text =
    (
      finalTranscript ||
      displayedTranscript ||
      document
        .getElementById(
          'recognizedText'
        )
        .textContent
    )
      .trim();


  if (
    !text ||
    text ===
    '음성 인식 내용이 여기에 표시됩니다.' ||
    text ===
    '듣고 있습니다...'
  ) {

    alert(
      '인식된 주문 내용이 없습니다.\n다시 말씀해주세요.'
    );


    finishRequested =
      false;


    updateVoiceUI();


    return;

  }


  isSending =
    true;


  document
    .getElementById(
      'voiceStatus'
    )
    .textContent =
      '🔎 음성을 분석하고 있어요...';


  showLoading(
    '주문 내용을 분석하고 있어요...'
  );


  setTimeout(
    function() {

      const parsed =
        parseOrderText(
          text
        );


      hideLoading();


      isSending =
        false;


      fillStep2(
        parsed
      );


      showStep2();

    },
    300
  );

}


// ==========================================================
// 🧠 주문 분석
// ==========================================================

function parseOrderText(
  text
) {

  const result = {

    type:
      selectedType,

    partnerId:
      '',

    itemId:
      '',

    quantity:
      1,

    date:
      getTodayLocal(),

    /*
     * 음성 전체를 메모로 넣지 않습니다.
     *
     * 아래에서 납품형태를 찾아
     * "납품형태 / 추가 내용" 형태로 만듭니다.
     */

    memo:
      '',

    deliveryType:
      ''

  };


  const normalized =
    String(
      text
    )
      .replace(
        /\s+/g,
        ' '
      )
      .trim();


  if (
    /입고|입고해|받아|들어|입고로/i
      .test(
        normalized
      )
  ) {

    result.type =
      'in';

  }


  if (
    /출고|출고해|보내|납품|출하/i
      .test(
        normalized
      )
  ) {

    result.type =
      'out';

  }


  const quantityMatch =
    normalized.match(
      /(\d+)\s*(개|박스|box|BOX)?/
    );


  if (
    quantityMatch
  ) {

    const number =
      Number(
        quantityMatch[1]
      );


    if (
      number > 0
    ) {

      result.quantity =
        number;

    }

  }


  let itemMatch =
    null;


  if (
    /15\s*(kg|KG|키로|킬로)/i
      .test(
        normalized
      )
  ) {

    itemMatch =
      findItemByKeyword(
        '15'
      );

  } else if (
    /12\s*(kg|KG|키로|킬로)/i
      .test(
        normalized
      )
  ) {

    itemMatch =
      findItemByKeyword(
        '12'
      );

  } else if (
    /20\s*(kg|KG|키로|킬로)/i
      .test(
        normalized
      )
  ) {

    itemMatch =
      findItemByKeyword(
        '20'
      );

  }


  if (
    itemMatch
  ) {

    result.itemId =
      itemMatch.id;

  }


  let bestPartner =
    null;


  masterData.partners.forEach(
    function(partner) {

      if (
        normalized.includes(
          partner.name
        )
      ) {

        if (
          !bestPartner ||
          partner.name.length >
          bestPartner.name.length
        ) {

          bestPartner =
            partner;

        }

      }

    }
  );


  if (
    bestPartner
  ) {

    result.partnerId =
      bestPartner.id;

  }


  // ==========================================================
  // 🚚 납품형태 분석
  //
  // 택배 / 택배로 / 택배 보내줘
  // → 택배 발송
  //
  // 본사 / 본사에서 / 본사 발송
  // → 본사 발송
  // ==========================================================

  let deliveryType =
    '';


  let deliveryMatch =
    normalized.match(
      /(택배(?:로|를)?(?:\s*보내|발송)?|택배\s*발송)/i
    );


  if (
    deliveryMatch
  ) {

    deliveryType =
      '택배 발송';

  } else {

    deliveryMatch =
      normalized.match(
        /(본사(?:에서|로|를)?(?:\s*보내|발송)?|본사\s*발송)/i
      );


    if (
      deliveryMatch
    ) {

      deliveryType =
        '본사 발송';

    }

  }


  result.deliveryType =
    deliveryType;


  // ==========================================================
  // 📝 추가 메모
  //
  // 구조화 정보 전체를 메모로 넣지 않습니다.
  //
  // 납품형태가 있으면
  //
  //   납품형태 / 그 뒤의 추가 내용
  //
  // 으로 만듭니다.
  // ==========================================================

  let extraMemo =
    normalized;


  /*
   * 거래처 이름 제거
   */

  if (
    bestPartner
  ) {

    extraMemo =
      extraMemo
        .replace(
          bestPartner.name,
          ''
        );

  }


  /*
   * 제품 규격 제거
   */

  extraMemo =
    extraMemo
      .replace(
        /\b(?:12|15|20)\s*(kg|KG|키로|킬로)\b/gi,
        ''
      );


  /*
   * 수량 제거
   */

  extraMemo =
    extraMemo
      .replace(
        /\b\d+\s*(개|박스|box|BOX)?\b/gi,
        ''
      );


  /*
   * 입출고 표현 제거
   */

  extraMemo =
    extraMemo
      .replace(
        /입고(?:해|로)?/gi,
        ''
      )
      .replace(
        /출고(?:해|로)?/gi,
        ''
      )
      .replace(
        /출하/gi,
        ''
      );


  /*
   * 납품형태 및 기본 명령어 제거
   */

  if (
    deliveryMatch
  ) {

    extraMemo =
      extraMemo
        .replace(
          deliveryMatch[0],
          ''
        );

  }


  extraMemo =
    extraMemo
      .replace(
        /납품/gi,
        ''
      )
      .replace(
        /보내(?:줘|주세요)?/gi,
        ''
      )
      .replace(
        /발송(?:해|해주세요)?/gi,
        ''
      )
      .replace(
        /출하(?:해|해주세요)?/gi,
        ''
      )
      .replace(
        /\s+/g,
        ' '
      )
      .trim();


  if (
    deliveryType
  ) {

    result.memo =
      deliveryType +
      (
        extraMemo
          ? ' / ' +
            extraMemo
          : ''
      );

  } else {

    result.memo =
      extraMemo;

  }


  return result;

}


// ==========================================================
// 🔎 상품 찾기
// ==========================================================

function findItemByKeyword(
  keyword
) {

  const targetSize =
    Number(
      keyword
    );


  const items =
    masterData.items
      .filter(
        function(item) {

          const size =
            getProductSize(
              item.name
            );


          return (
            size ===
            targetSize
          );

        }
      );


  /*
   * 기존처럼 첫 번째 BoxHero 상품을 사용합니다.
   */

  return (
    items[0] ||
    null
  );

}

function directInputAnalyze() {

  const partnerId =
    document
      .getElementById(
        'directPartner'
      )
      .value;


  const itemId =
    document
      .getElementById(
        'directItem'
      )
      .value;

    Number(
      document
        .getElementById(
          'directQuantity'
        )
        .value
    );


  const date =
    document
      .getElementById(
        'directDate'
      )
      .value ||
      getTodayLocal();


  const memo =
    document
      .getElementById(
        'directMemo'
      )
      .value
      .trim();


  if (
    !partnerId
  ) {

    alert(
      '거래처를 선택해주세요.'
    );

    return;

  }


  if (
    !itemId
  ) {

    alert(
      '제품을 선택해주세요.'
    );

    return;

  }


  if (
    !quantity ||
    quantity <= 0
  ) {

    alert(
      '수량을 입력해주세요.'
    );

    return;

  }


  fillStep2({

    type:
      selectedType,

    partnerId:
      partnerId,

    itemId:
      itemId,

    quantity:
      quantity,

    date:
      date,

    memo:
      memo ||
      ''

  });


  showStep2();

}

function fillStep2(
  data
) {

    data.type
  ) {

    setType(
      data.type
    );

  }


  document
    .getElementById(
      'partnerSelect'
    )
    .value =
      data.partnerId || '';


  document
    .getElementById(
      'itemSelect'
    )
    .value =

  document
    .getElementById(
      'quantityInput'
    )
    .value =
      data.quantity || 1;


  document
    .getElementById(
      'typeSelect'
    )
    .value =
      data.type ||
      selectedType;


  document
    .getElementById(
      'dateInput'
    )
    .value =
      data.date ||
      getTodayLocal();


  document
    .getElementById(
      'deliveryTypeSelect'
    )
    .value =
      data.deliveryType || '';


  document
    .getElementById(
      'memoInput'
    )
    .value =
      data.memo || '';


  /*
   * 음성 분석에서 납품형태를 인식했다면
   * 메모에는 이미
   *
   * 택배 발송 / 추가내용
   *
   * 형태로 들어 있으므로
   * 별도로 다시 추가하지 않습니다.
   */

  if (
    data.deliveryType &&
    !data.memo
  ) {

    document
      .getElementById(
        'memoInput'
      )
      .value =
        data.deliveryType;

  }


  updateSelectedClient();

  updatePartnerSearchText();

  updateSummary();

}

      );

  );

       * 입력창에 직접 포커스했을 때도

      renderPartnerCandidates(
        input.value
      );

    }
  );

// ==========================================================
// 👥 거래처 후보
// ==========================================================

function renderPartnerCandidates(
  keyword
) {

  const container =
    document
      .getElementById(
        'clientCandidates'
      );


  if (
    !container
  ) {

    return;

  }


  const normalized =
    String(
      keyword || ''
    )
      .trim()
      .toLowerCase();


  const partners =
    [...masterData.partners]
      .filter(
        function(partner) {

          if (
            !normalized
          ) {

            return true;

          }


          return String(
            partner.name
          )
            .toLowerCase()
            .includes(
              normalized
            );

        }
      )
      .sort(
        function(a, b) {

          return String(
            a.name
          ).localeCompare(
            String(
              b.name
            ),
            'ko'
          );

        }
      )
      .slice(
        0,
        30
      );


  container.innerHTML =
    '';


  if (
    partners.length === 0
  ) {

    const empty =
      document.createElement(
        'div'
      );


    empty.className =
      'client-candidate';


    empty.textContent =
      '검색되는 거래처가 없습니다.';


    container.appendChild(
      empty
    );


    return;

  }


  partners.forEach(
    function(partner) {

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'client-candidate';


      div.textContent =
        partner.name;


      div.addEventListener(
        'click',
        function() {

          selectPartner(
            partner.id
          );

        }
      );


      container.appendChild(
        div
      );

    }
  );

}

// ==========================================================
// 🚚 납품형태 → 메모 자동 반영
//
// 메모의 첫 부분은 항상 납품형태.
// 그 뒤의 추가 메모는 유지합니다.
//
// 예:
// 택배 발송 / 오후 3시까지 보내주세요
//
// → 본사 발송으로 변경
//
// 본사 발송 / 오후 3시까지 보내주세요
//
// ==========================================================

function applyDeliveryTypeToMemo() {

  const deliveryType =
    document
      .getElementById(
        'deliveryTypeSelect'
      )
      .value;


  const memoInput =
    document
      .getElementById(
        'memoInput'
      );


  const currentMemo =
    memoInput
      .value
      .trim();


  /*
   * 기존 납품형태 접두어만 제거합니다.
   *
   * 뒤의 실제 메모는 그대로 보존합니다.
   */

  const cleanedMemo =
    currentMemo
      .replace(
        /^(택배 발송|본사 발송)\s*(\/\s*)?/,
        ''
      )
      .trim();


  if (
    deliveryType
  ) {

    memoInput.value =
      deliveryType +
      (
        cleanedMemo
          ? ' / ' +
            cleanedMemo
          : ''
      );

  } else {

    memoInput.value =
      cleanedMemo;

  }


  updateSummary();

}

      event.target.id ===
      'typeSelect' ||

      event.target.id ===
      'dateInput' ||

      event.target.id ===
      'deliveryTypeSelect'

      if (
        event.target.id ===
        'typeSelect'

        selectedType =

        setType(

      }


      if (
        event.target.id ===
        'deliveryTypeSelect'
      ) {

        applyDeliveryTypeToMemo();

      }


      updateSummary();

    }

  }
);


// ==========================================================
// 🚀 실제 BoxHero 등록
// ==========================================================

function registerTransaction() {

  const partnerId =
    document
      .getElementById(
        'partnerSelect'
      )
      .value;


  const itemId =
    document
      .getElementById(
        'itemSelect'
      )
      .value;


  const quantity =
    Number(
      document
        .getElementById(
          'quantityInput'
        )
        .value
    );


  const type =
    document
      .getElementById(
        'typeSelect'
      )
      .value;


  const date =
    document
      .getElementById(
        'dateInput'
      )
      .value;


  const deliveryType =
    document
      .getElementById(
        'deliveryTypeSelect'
      )
      .value;


  let memo =
    document
      .getElementById(
        'memoInput'
      )
      .value
      .trim();


  if (
    !partnerId
  ) {

    alert(
      '거래처를 선택해주세요.'
    );

    return;

  }


  if (
    !itemId
  ) {

    alert(
      '제품을 선택해주세요.'
    );

    return;

  }


  if (
    !quantity ||
    quantity <= 0
  ) {

    alert(
      '수량을 확인해주세요.'
    );

    return;

  }


  if (
    !date
  ) {

    alert(
      '날짜를 선택해주세요.'
    );

    return;

  }


  const location =
    masterData.locations[0];


  if (
    !location
  ) {

    alert(
      'BoxHero 위치 정보를 찾을 수 없습니다.'
    );

    return;

  }


  const transactionDateTime =
    combineDateAndTime(
      date
    );


  /*
   * --------------------------------------------------------
   * 📝 최종 메모
   *
   * 메모 안에 이미 납품형태가 들어있다면
   * 다시 앞에 붙이지 않습니다.
   *
   * 결과:
   *
   * 푸로찜 에스 음성입출고 /
   * 날짜=2026-09-15 11:20:30 /
   * 메모=택배 발송 / 오후에 보내주세요
   *
   * --------------------------------------------------------
   */

  if (
    deliveryType &&
    !memo
  ) {

    memo =
      deliveryType;

  }


  const finalMemo =
    [
      '푸로찜 에스 음성입출고',

      '날짜=' +
      transactionDateTime,

      memo
        ? '메모=' +
          memo
        : ''

    ]
      .filter(
        function(value) {

          return value !== '';

        }
      )
      .join(
        ' / '
      );


  const registerButton =
    document
      .getElementById(
        'registerButton'
      );


  registerButton.disabled =
    true;


  showLoading(
    'BoxHero에 실제 재고를 등록하고 있습니다...'
  );


  callGas(
    'registerBoxHeroTransaction',
    {

      type:
        type,

      partnerId:
        partnerId,

      itemId:
        itemId,

      locationId:
        location.id,

      quantity:
        quantity,

      transactionDate:
        transactionDateTime,

      memo:
        finalMemo

    }
  )
    .then(
      function(result) {

        hideLoading();

        registerButton.disabled =
          false;

        showResult(
          result
        );

      }
    )
    .catch(
      function(error) {

        hideLoading();

        registerButton.disabled =
          false;

        alert(
          'BoxHero 등록에 실패했습니다.\n\n' +
          getErrorMessage(error)
        );

      }
    );

}

// ==========================================================
// ❗ 오류 메시지
// ==========================================================

function getErrorMessage(
  error
) {

  if (
    !error
  ) {

    return '알 수 없는 오류';

  }


  if (
    typeof error ===
    'string'
  ) {

    return error;

  }


  return (
    error.message ||
    JSON.stringify(
      error
    )
  );

}


// ==========================================================
// 🔐 HTML escape
// ==========================================================

function escapeHtml(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}
